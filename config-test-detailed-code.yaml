# Test Configuration for Detailed Code-Block Explanation with Chunking
source:
  mode: single
  # Using cobol74 test project - ACCTMAIN (Account Management main program)
  source_files: /home/santosh/cobol-test/cobol74/programs/online/ACCTMAIN.cbl
  program_name: ACCTMAIN

output:
  metadata_dir: ../metadata
  docs_path: ../docs

# MCP Server Configuration
servers:
  ctags:
    enabled: true
    docker_image: ctags-mcp:test
  gnuCobol:
    enabled: true
    docker_image: gnucobol-mcp:test
  superbol-lsp:
    enabled: true
    docker_image: superbol-mcp:test

llm:
  provider: openai
  model: gpt-4.1
  api_key: ${OPENAI_API_KEY}
  temperature: 0.2

source_extraction:
  enabled: true
  compress: false

logging:
  level: info
  verbose: true
