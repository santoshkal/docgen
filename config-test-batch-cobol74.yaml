# ============================================================================
# Test Configuration - COBOL74 Project (Batch Mode - All Files)
# ============================================================================
# This config processes ALL COBOL files in the cobol74 test project.
# Metadata has been pre-generated - no MCP servers needed for metadata.
# ============================================================================

# ----------------------------------------------------------------------------
# SOURCE FILES CONFIGURATION
# ----------------------------------------------------------------------------
source:
  # Batch mode: Process all COBOL files in the directory
  mode: batch

  # Path to COBOL source directory
  source_files: /home/santosh/cobol-test/cobol74/programs

  # Program name not needed for batch mode (ignored)
  # program_name: N/A

# ----------------------------------------------------------------------------
# OUTPUT PATHS
# ----------------------------------------------------------------------------
output:
  create_dirs: true
  # Metadata directory (pre-generated by test_metadata_e2e.py)
  metadata_dir: /home/santosh/cobol-work/metadata
  # Output directory for generated documentation
  # Structure will mirror source: docs/batch/*.md, docs/online/*.md
  docs_path: /home/santosh/cobol-work/docs

# ----------------------------------------------------------------------------
# MCP SERVERS (Available but not used for metadata - already generated)
# ----------------------------------------------------------------------------
servers:
  ctags:
    enabled: true
    docker_image: ctags-mcp:test
  gnuCobol:
    enabled: true
    docker_image: gnucobol-mcp:test
  superbol-lsp:
    enabled: true
    docker_image: superbol-mcp:test

# ----------------------------------------------------------------------------
# METADATA GENERATION - DISABLED (Using pre-generated metadata)
# ----------------------------------------------------------------------------
metadata:
  generate: false
  skip_existing: true

# ----------------------------------------------------------------------------
# TEMPLATE CONFIGURATION
# ----------------------------------------------------------------------------
template:
  # Per-file documentation template
  path: ./cobol-doc-template.yaml
  # Project overview template (for final summary document)
  project_overview_path: ./project-overview-template.yaml

# ----------------------------------------------------------------------------
# LLM CONFIGURATION
# ----------------------------------------------------------------------------
llm:
  provider: openai
  model: gpt-4.1
  api_key: ${OPENAI_API_KEY}
  temperature: 0.2

# ----------------------------------------------------------------------------
# SOURCE CODE EXTRACTION
# ----------------------------------------------------------------------------
source_extraction:
  enabled: true
  compress: false

# ----------------------------------------------------------------------------
# LOGGING
# ----------------------------------------------------------------------------
logging:
  level: info
  verbose: true

# ----------------------------------------------------------------------------
# PROJECT OVERVIEW GENERATION
# ----------------------------------------------------------------------------
# Generate project-level summary after all individual docs are complete
project_overview:
  enabled: true
  # Use project-level metadata from these files:
  call_graph: /home/santosh/cobol-work/metadata/superbol/cfg/call_graph.json
  project_relationships: /home/santosh/cobol-work/metadata/gnucobol/project-relationships.json
  file_list: /home/santosh/cobol-work/metadata/file_list.json
