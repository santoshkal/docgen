# ============================================================================
# iMES .NET/C# BATCH PROCESSING CONFIGURATION
# ============================================================================
#
# This configuration is for batch processing the iMES C# codebase
# with checkpoint/resume support.
#
# Usage:
#   python cobol_doc_agent.py --config config-dotnet-imes.yaml
#   python cobol_doc_agent.py --config config-dotnet-imes.yaml --status
#   python cobol_doc_agent.py --config config-dotnet-imes.yaml --restart
#

# ============================================================================
# SOURCE CONFIGURATION
# ============================================================================
source:
  language: dotnet
  mode: batch
  source_files: ~/Downloads/iMES-master
  workspace: ~/Downloads/iMES-master

  # ─────────────────────────────────────────────────────────────────────────
  # FILE FILTERING
  # ─────────────────────────────────────────────────────────────────────────
  extensions:
    include: ['.cs']

  # File pattern exclusion - auto-generated / boilerplate files
  exclude_files:
    - 'AssemblyInfo.cs'
    - '*.Designer.cs'
    - '*.g.cs'
    - '*.g.i.cs'
    - 'GlobalSuppressions.cs'

  # File pattern inclusion - if set, ONLY these files (overrides all other filters)
  include_files:
    - "IScriptCommand.cs"
    - "DefaultScriptCommand.cs"
    # - "HeijunkaData.cs"
    # - "Script.cs"
    # - "DelphiTcscCommands.cs"
    # - "BroadcastService.cs"

# ============================================================================
# OUTPUT CONFIGURATION
# ============================================================================
output:
  metadata_dir: ../output-imes/metadata-questions
  cross_references_dir: ../output-imes/metadata-5p/cross_references/per_file
  docs_path: ../output-imes/docs-questions
  create_dirs: true

# ============================================================================
# LLM CONFIGURATION - CLAUDE SDK
# ============================================================================
llm:
  provider: claude_sdk
  model: claude-opus-4-6
  temperature: 0.2

  # Beta flag for 1M context — applied conditionally when context > 120K tokens
  # betas:
  #   - context-1m-2025-08-07

  # Phase 1 (code explanation): chunked per-block generator.
  phase1:
    model: claude-opus-4-6
    thinking: disabled            # Options: disabled, adaptive, or {type: enabled, budget_tokens: N}

  # Phase 2 (RLM REPL + PageIndex). Replaces the legacy per-section Phase 2.
  # `root_model` drives the ClaudeSDKClient multi-turn loop that writes ```repl``` blocks;
  # `sub_model` serves the sub-LLM calls fired from within those blocks
  # (llm_query / llm_query_batched).
  rlm:
    root_model: claude-opus-4-6
    sub_model: claude-opus-4-6
    max_output_tokens: 64000
    max_thinking_tokens: 0        # 0 disables thinking (faster responses)
    max_iterations: 10            # Root-LLM turns per section before forcing FINAL

  # Optional fallback (triggered on unrecoverable LLM error, then session-wide).
  # `fallback.rlm` mirrors `llm.rlm` and is used by Phase 2 once the fallback
  # manager has been triggered.
  # fallback:
  #   provider: claude_sdk
  #   phase1:
  #     model: sonnet
  #   rlm:
  #     root_model: claude-sonnet-4-6
  #     sub_model: claude-sonnet-4-6
  #     max_output_tokens: 32000
  #     max_iterations: 10

# ============================================================================
# PAGEINDEX CONFIGURATION (Phase 2 input)
# ============================================================================
# The Phase 2 RLM pipeline first builds a PageIndex tree from the Phase 1
# code-explanation markdown. The tree provides chunk → block hierarchy with
# per-chunk tags/retrieval_questions and per-block purpose/technical_details/
# cross_references — used by the root LLM for targeted retrieval.
pageindex:
  enabled: true

  # Mode: "extract" (zero-LLM, parses Purpose/Technical/CrossRef/CallFlow/DataFlow
  # blocks from the structured Phase 1 doc — instant, free) or "llm" (Claude
  # summaries via the PageIndex project — requires RLM_DEMO_PATH env var).
  mode: extract

  # Used only when mode: llm
  model: claude-opus-4-6
  # concurrency: 4              # Defaults to os.cpu_count()
  # thinning: false
  # min_token_threshold: 500

  # Include full text content in block nodes (used by root LLM for retrieval).
  include_text: true

  # Force regeneration even if the PageIndex JSON already exists on disk.
  regenerate: true

  # Where to persist the generated tree. Defaults to `{output.docs_path}/page_index/`.
  # output_dir: ../output-imes/metadata-5p/page_index

# ============================================================================
# RLM (Phase 2) CONFIGURATION
# ============================================================================
# Drives the RLM REPL + deterministic-generator loop. Defaults match
# ~/rlm/demo/pipeline-config.yaml.
rlm:
  # Sections dispatched to the RLM REPL (in template order).
  sections:
    - executive-summary
    - program-structure
    - control-flow-analysis
    - data-flow-analysis
    - inter-program-communication
    - business-logic
    - error-handling
    - technical-details
    - code-references

  # Sections handled statically in Phase 3 assembly (no Phase 2 LLM call).
  skip_sections:
    - detailed-code-explanation

  # Sections emitted by pure-Python deterministic generators (zero LLM calls)
  # when the required metadata is present. Falls back to RLM if generator
  # returns None.
  deterministic_sections:
    - document-header
    - control-flow-analysis
    - assembly-references
    - code-references
    - technical-details
    - metadata-appendix

  # ────────────────────────────────────────────────────────────────────────
  # NODE-COVERAGE VERIFIER
  # ────────────────────────────────────────────────────────────────────────
  # For each RLM section, every sub-LLM call's `node_id` argument is recorded
  # to a JSONL log by the Python plumbing (NOT by the root LLM — so the log
  # cannot be fabricated). After the section finishes, a deterministic pass
  # diffs the expected set of node IDs (walked from the PageIndex tree)
  # against the set actually called. Missing nodes trigger a gap-fill pass.
  coverage:
    enabled: true
    # When true, any missing nodes are patched by a direct Python loop that
    # calls the sub-LLM on each missing node (one call per node) and appends
    # the findings to the section as a "Coverage Annex". Set to false to only
    # report the gap without patching.
    gap_fill_enabled: true
    # When true, any gap aborts the pipeline with RuntimeError instead of
    # running gap-fill. Useful for CI checks; keep false for production runs.
    strict: false
    # Directory for per-section JSONL logs. Defaults to
    # `{output.rlm_log_dir}/coverage/` (which itself defaults to
    # `{output.docs_path}/rlm_logs/coverage/`).
    # log_dir: ../output-imes/docs-phase1/rlm_logs/coverage

# ============================================================================
# MERMAID VALIDATION (Phase 2 post-processing)
# ============================================================================
# After each Phase 2 section is generated, any ```mermaid block inside it is
# validated via a Docker-based MCP server. Invalid diagrams are handed to an
# LLM to repair (with the full section as context) and re-validated up to
# `max_retries` times.
mermaid_validator:
  enabled: true
  docker_image: mermaid-mcp:test
  # Arguments passed to `docker` (before the image name). `--rm` keeps the
  # container ephemeral; `-i` keeps stdin open for the MCP stdio transport.
  docker_args:
    - run
    - -i
    - --rm
  # Name of the MCP tool on the mermaid server used to check a block.
  tool_name: validate
  # Max number of LLM-rewrite attempts per invalid block before giving up.
  max_retries: 3

# ============================================================================
# FULL CONTEXT MODE CONFIGURATION
# ============================================================================
full_context:
  enabled: true

  sections:
    - executive-summary
    - key-responsibilities
    - business-logic
    - overview
    - data-flow-analysis
    - detailed-code-explanation

  program_map_overrides:
    top_n_paragraphs: 100
    top_n_data_items: 50

  max_message_chars: 9500000

  context_chaining:
    enabled: true
    max_tokens: null

# ============================================================================
# WORKFLOW CONFIGURATION
# ============================================================================
workflow:
  auto_start_phase2: true

# ============================================================================
# PROGRAM MAP CONFIGURATION
# ============================================================================
program_map:
  top_n_paragraphs: 50
  top_n_data_items: 30
  show_all: false

  dynamic_limits:
    enabled: true
    small_threshold: 100
    large_threshold: 500
    small:
      paragraphs: -1
      data_items: -1
    medium:
      paragraphs: 200
      data_items: 100
    large:
      paragraphs: 300
      data_items: 150

# ============================================================================
# METADATA GENERATION
# ============================================================================
metadata:
  generate: true
  skip_existing: true
  servers:
    ctags:
      enabled: true
      docker_image: ctags-mcp:test
      tools:
        - name: generate_tags
          args: { path: "{{workspace}}", languages: ["C#"], output_file: "/output/csharp-project.tags" }
          output_key: project_tags
          scope: project
        - name: get_file_outline
          args: { file_path: "{{source_file}}", tags_file: "/output/csharp-project.tags" }
          output_key: structural_outline
          scope: file
    tree-sitter:
      enabled: true
      docker_image: treesitter-mcp:test
      tools:
        - name: get_symbols
          args:
            source_code: "{{source_content}}"
            language: "c_sharp"
          output_key: symbol_table
          scope: file
        - name: generate_ast
          args:
            source_code: "{{source_content}}"
            language: "c_sharp"
            include_positions: true
            include_text: true
            max_depth: 6
          output_key: syntax_tree
          scope: file
    treesitter-graph:
      enabled: true
      docker_image: treesitter-graph-mcp:test
      tools:
        - name: tree_sitter_graph
          args:
            tsg_file: "{{chunking_query}}"
            source_file: "{{source_content}}"
            output_file: "/output/graph.json"
            create_temp_files: true
            source_extension: ".cs"
          output_key: chunking_boundaries
          scope: file

# ============================================================================
# CHUNKING CONFIGURATION
# ============================================================================
chunking:
  # Strategy: "tsg_graph" (tree-sitter-graph), "query_code" (tree-sitter), "ctags" (legacy)
  strategy: tsg_graph

  # Source code chunk sizing — set to "auto" for dynamic sizing based on model context,
  # or an explicit integer (e.g., 10000) to override.
  max_tokens_per_chunk: auto

  # Dynamic chunk sizing (only used when max_tokens_per_chunk is "auto")
  auto_chunk_sizing:
    model_context_limit: 200000   # Model input context window (tokens)
    overhead_buffer: 10000        # Reserved for program map, AST, structural context, etc.
    target_pct: 05                # Chunk = this % of (model_context_limit - overhead_buffer)

  # Include structural context headers in chunks sent to LLM
  # (e.g., "**Continues**: class LinePitch — 9 of 43 members")
  structural_context: true

  # Fallback strategy if tsg_graph results unavailable
  fallback_strategy: ctags

  # Tree-sitter-graph .tsg query for structural + containment graph.
  # Produces nodes with type, name, start_row, end_row + parent→child edges.
  queries:
    c_sharp: |
      ; === Standalone containers ===
      (namespace_declaration
        name: (_) @ns_name) @ns_def
      {
        node ns
        attr (ns) type = "namespace"
        attr (ns) name = (source-text @ns_name)
        attr (ns) start_row = (start-row @ns_def)
        attr (ns) end_row = (end-row @ns_def)
      }
      (enum_declaration
        name: (identifier) @enum_name) @enum_def
      {
        node en
        attr (en) type = "enum"
        attr (en) name = (source-text @enum_name)
        attr (en) start_row = (start-row @enum_def)
        attr (en) end_row = (end-row @enum_def)
      }
      (struct_declaration
        name: (identifier) @struct_name) @struct_def
      {
        node st
        attr (st) type = "struct"
        attr (st) name = (source-text @struct_name)
        attr (st) start_row = (start-row @struct_def)
        attr (st) end_row = (end-row @struct_def)
      }
      (interface_declaration
        name: (identifier) @iface_name) @iface_def
      {
        node ifc
        attr (ifc) type = "interface"
        attr (ifc) name = (source-text @iface_name)
        attr (ifc) start_row = (start-row @iface_def)
        attr (ifc) end_row = (end-row @iface_def)
      }
      ; === Class + member containment edges ===
      (class_declaration
        name: (identifier) @cls1
        body: (declaration_list
          (method_declaration
            name: (identifier) @meth_name) @meth_def)) @cls1_def
      {
        node parent1
        attr (parent1) type = "class"
        attr (parent1) name = (source-text @cls1)
        attr (parent1) start_row = (start-row @cls1_def)
        attr (parent1) end_row = (end-row @cls1_def)
        node child1
        attr (child1) type = "method"
        attr (child1) name = (source-text @meth_name)
        attr (child1) start_row = (start-row @meth_def)
        attr (child1) end_row = (end-row @meth_def)
        edge parent1 -> child1
      }
      (class_declaration
        name: (identifier) @cls2
        body: (declaration_list
          (constructor_declaration
            name: (identifier) @ctor_name) @ctor_def)) @cls2_def
      {
        node parent2
        attr (parent2) type = "class"
        attr (parent2) name = (source-text @cls2)
        attr (parent2) start_row = (start-row @cls2_def)
        attr (parent2) end_row = (end-row @cls2_def)
        node child2
        attr (child2) type = "constructor"
        attr (child2) name = (source-text @ctor_name)
        attr (child2) start_row = (start-row @ctor_def)
        attr (child2) end_row = (end-row @ctor_def)
        edge parent2 -> child2
      }
      (class_declaration
        name: (identifier) @cls3
        body: (declaration_list
          (property_declaration
            name: (identifier) @prop_name) @prop_def)) @cls3_def
      {
        node parent3
        attr (parent3) type = "class"
        attr (parent3) name = (source-text @cls3)
        attr (parent3) start_row = (start-row @cls3_def)
        attr (parent3) end_row = (end-row @cls3_def)
        node child3
        attr (child3) type = "property"
        attr (child3) name = (source-text @prop_name)
        attr (child3) start_row = (start-row @prop_def)
        attr (child3) end_row = (end-row @prop_def)
        edge parent3 -> child3
      }
      (class_declaration
        name: (identifier) @cls4
        body: (declaration_list
          (field_declaration
            (variable_declaration
              (variable_declarator
                (identifier) @field_name))) @field_def)) @cls4_def
      {
        node parent4
        attr (parent4) type = "class"
        attr (parent4) name = (source-text @cls4)
        attr (parent4) start_row = (start-row @cls4_def)
        attr (parent4) end_row = (end-row @cls4_def)
        node child4
        attr (child4) type = "field"
        attr (child4) name = (source-text @field_name)
        attr (child4) start_row = (start-row @field_def)
        attr (child4) end_row = (end-row @field_def)
        edge parent4 -> child4
      }

# ============================================================================
# SOURCE CODE EXTRACTION
# ============================================================================
source_extraction:
  enabled: true
  compress: true

# ============================================================================
# TEMPLATE CONFIGURATION
# ============================================================================
template:
  path: ./languages/dotnet/template.yaml

# ============================================================================
# CHECKSUM VALIDATION
# ============================================================================
validate_checksums:
  source_checksum_file_path: ../output-imes/source-checksum.yaml
  metadata_checksum_file_path: ../output-imes/metadata-checksum.yaml

# ============================================================================
# LOGGING CONFIGURATION
# ============================================================================
logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  verbose: true
  show_progress: true

# ============================================================================
# RUN LOGGING - Centralized per-run artifact capture
# ============================================================================
run_logging:
  console_tee: true
  capture_requests: true
  capture_traces: true
