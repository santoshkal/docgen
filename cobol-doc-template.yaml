# COBOL Code Documentation Template (BMAD-METHOD Inspired, v4)
# v4 highlights:
# - Environment-aware dependency categorization (XGEN/UNISYS examples, still generic)
# - Executive Summary tied to PROGRAM NARRATIVE / OPERATING INSTRUCTIONS
# - Diagrams are HIGH-LEVEL, HUMAN-READABLE (not full CFG/DFG dumps)
# - Mermaid syntax constrained to a VSCode-friendly subset
# - Works for any COBOL dialect (COBOL-68/74/85, Enterprise, GnuCOBOL, Unisys, etc.)

template:
  id: cobol-documentation-template-v4
  name: COBOL Code Documentation
  version: 4.0
  output:
    format: markdown
    filename: "docs/{{program_name}}-documentation.md"
    title: "{{program_name}} - Code Documentation"

workflow:
  mode: automated
  metadata_sources:
    - superbol_symbols
    - superbol_cfg
    - gnucobol_analysis
    - ctags_outline

#######################################################################################
# GLOBAL ENVIRONMENT-AWARE DEPENDENCY CATEGORIZATION HEURISTICS
#######################################################################################

dependency_categorization_heuristics:
  # These patterns guide classification of external calls into:
  # - Runtime/Platform/Generator
  # - Shared Utility
  # - Business/Application
  #
  # They are examples; you can extend them for your own environment.

  runtime_platform_patterns:
    # Vendor/generator/runtime indicators (XGEN/UNISYS-style)
    - "XGEN"
    - "UNISYS"
    - "GENERALSUPPORT"
    - "GENLIB"
    - "RUNTIME"
    - "RTLIB"
    - "COBOLRT"
    - "SUPPORTLIB"
    # Generic runtime-ish names (still just hints, not absolute)
    - "DATE"
    - "TIME"
    - "STRING"
    - "PRINTER"
    - "PRINT"
    - "FORMAT"

  shared_utility_patterns:
    # Cross-application helper components
    - "ERR"
    - "ERROR"
    - "LOG"
    - "MSG"
    - "VALID"
    - "VALD"
    - "CONVERT"
    - "CNV"
    - "LOOKUP"
    - "LKP"

  business_prefixes:
    # Your environment (TDAS/TDAR/CSI-style)
    - "TDAS"
    - "TDAR"
    - "TDD"
    - "CSI"
    - "CUST"
    - "ACCT"
    # Generic examples for other shops
    - "POLICY"
    - "CLAIM"
    - "PAYROLL"
    - "PAY"
    - "FIN"
    - "BILL"

  fallback_rules:
    treat_numeric_only_as_utility: true
    default_category: "Shared Utility"

#######################################################################################
# GLOBAL MERMAID SYNTAX GUIDELINES (VSCode-FRIENDLY SUBSET)
#######################################################################################
mermaid_syntax_guidelines:
  # All Mermaid diagrams MUST follow this **strict, VSCode-tested subset**.
  # The goal is: “always render, never parse-error” in the common VSCode Mermaid
  # preview extensions.
  #
  # GENERAL:
  # - Diagrams must be SIMPLE, HIGH-LEVEL, and use only the constructs described here.
  # - If information cannot be expressed safely in a diagram (e.g., long line lists,
  #   complex labels), put it in normal markdown text near the diagram instead.
  #
  # 1. FENCING & PLACEMENT
  #    - Always fence diagrams as:
  #        ```mermaid
  #        graph LR
  #          ...
  #        ```
  #      or:
  #        ```mermaid
  #        flowchart TD
  #          ...
  #        ```
  #        ```mermaid
  #        sequenceDiagram
  #          ...
  #        ```
  #    - The opening fence MUST be at column 0 and exactly "```mermaid".
  #    - The closing fence MUST be at column 0 and exactly "```".
  #    - Do NOT put extra backticks inside the diagram content.
  #    - Only ONE diagram per fenced block.
  #
  # 2. NODE IDS (LEFT SIDE OF DEFINITIONS / EDGES)
  #    - Node IDs must be **simple identifiers**:
  #        - Allowed characters: A–Z, a–z, 0–9, underscore (_).
  #        - MUST NOT contain spaces, hyphens, asterisks, quotes, slashes,
  #          parentheses, or other punctuation.
  #        - Examples of valid IDs: A, A1, INIT_MAIN, Z_RPT_1_NEWPAGE.
  #        - Examples of invalid IDs: "000026*REMARKS", "L-S/GENL", "CURRENT-DATE".
  #    - If you need to represent a complex name (e.g., "000026*REMARKS"), put that
  #      only in the LABEL, never in the ID.
  #
  # 3. NODE LABELS (INSIDE [ "..." ] OR ( "..." ) )
  #    - Always use the explicit label form:
  #        ID["Label text"]
  #        ID("Label text")
  #    - Labels are for humans and MAY contain:
  #        - Letters, digits, spaces
  #        - Hyphens (-), slashes (/), underscores (_)
  #    - To avoid parser issues, labels MUST **NOT** contain:
  #        - HTML tags (no <br/>, <b>, <i>, etc.)
  #        - Backticks (`) or any template fences
  #        - Double quotes (") or single quotes (') inside the label
  #        - Angle brackets (<, >)
  #        - Colons (:), commas (,), or parentheses ((, )) if they can be avoided
  #    - For line breaks inside labels:
  #        - Use the literal newline escape `\n` inside the label string:
  #            A1["Initialize Date Registers\nZ-DATE-INITIALIZE-REGS"]
  #        - Do NOT use `<br/>` or `<br>`.
  #    - If you must show line numbers or counts, prefer a simple style like:
  #        A1["CURRENT_DATE OF GENERALSUPPORT\n16 calls"]
  #      rather than including long, comma-separated lists.
  #
  # 4. EDGE DEFINITIONS & EDGE LABELS
  #    - Allowed edge forms:
  #        A --> B
  #        A -.-> B
  #        A -->|LABEL| B
  #        A -.->|LABEL| B
  #
  #    - Edge labels MUST be extremely simple to avoid parse errors:
  #        - Allowed characters: A–Z, a–z, 0–9, underscore (_), lowercase "x".
  #        - NO spaces, NO parentheses, NO commas, NO colons, NO slashes.
  #        - If you want "16x CURRENT_DATE (lines ...)", convert to e.g.:
  #            A -.->|16x_CURRENT_DATE| RUNTIME_SERVICES
  #        - Use surrounding markdown text to explain detailed line lists; do NOT
  #          embed them in the label itself.
  #
  # 5. CLASS DEFINITIONS & STYLING
  #    - Class definitions are allowed in this form:
  #        classDef runtime fill:#ddd,stroke:#333,stroke-width:1px;
  #        classDef utility fill:#fc9,stroke:#333,stroke-width:1px;
  #        class NODE_ID runtime;
  #    - Class definition names and class usage must:
  #        - Use only A–Z, a–z, 0–9, underscore (_).
  #        - Not contain template variables directly.
  #    - Colors and stroke-widths are allowed as in standard Mermaid, but keep them
  #      simple; avoid advanced theme features.
  #
  # 6. SUBGRAPHS (WHEN USED)
  #    - Use sanitized IDs for subgraphs:
  #        subgraph SG_000026 ["000026*REMARKS"]
  #          ...
  #        end
  #    - The subgraph ID (e.g. SG_000026) follows node ID rules.
  #    - The subgraph label in brackets follows the same LABEL rules (no HTML,
  #      no quotes, minimal punctuation).
  #
  # 7. SEQUENCE DIAGRAMS
  #    - Use:
  #        ```mermaid
  #        sequenceDiagram
  #          participant USER
  #          participant PROG as "{{program_name}}"
  #          USER->>PROG: Start job
  #        ```
  #    - Participant IDs (left of "as") MUST follow node ID rules (A–Z, a–z, 0–9, _).
  #    - If program_name may contain hyphens or spaces, use it ONLY in the label:
  #        participant PROG as "{{program_name}}"
  #    - Message syntax:
  #        A->>B: Text
  #      where "Text":
  #        - May contain spaces.
  #        - Must NOT contain backticks, HTML, or template fences.
  #
  # 8. TEMPLATE VARIABLE SAFETY
  #    - NEVER use a raw template variable (like {{program_name}}) directly as a node ID.
  #      Instead:
  #        - Use a fixed ID and put the template variable in the label:
  #            CURRENT_PROG["{{program_name}}"]
  #        - Or for sequenceDiagram:
  #            participant PROG as "{{program_name}}"
  #    - Any injected templated content must still obey LABEL rules.
  #
  # 9. SCOPE & COMPLEXITY
  #    - Diagrams must be **high-level**:
  #        - 5–20 nodes total (typical).
  #        - Focus on main drivers, key dependencies, core data flows.
  #    - DO NOT attempt full paragraph-by-paragraph CFGs or DFGs in Mermaid.
  #      Use tables and prose for detailed coverage.
  #
  # 10. ERROR PREVENTION STRATEGY
  #    - If you are about to include any of the following in a Mermaid diagram,
  #      remove or simplify them:
  #        - `<br/>`, `<br>`, or other HTML tags
  #        - `\"` or any escaped quotes
  #        - Parenthesized line lists (e.g., `(lines: 12840, 14104, ...)`)
  #        - Long, comma-separated lists
  #        - Colons `:` inside labels
  #    - Prefer to show such details in adjacent markdown text instead.

#######################################################################################
# DOCUMENT HEADER
#######################################################################################

sections:
  - id: document-header
    title: "Document Header"
    instruction: |
      Extract program name and generate header.
      Include timestamp and metadata sources.

      Replace ALL template variables (no placeholders allowed).
    sections:
      - id: metadata-info
        title: Document Information
        template: |
          **Generated**: {{generation_timestamp}}
          **Program ID**: {{program_name}}
          **Source File**: {{source_file_path}}
          **Metadata Sources**: Static code analysis, semantic analysis, and symbol parsing

#######################################################################################
# EXECUTIVE SUMMARY
#######################################################################################

  - id: executive-summary
    title: Executive Summary
    instruction: |
      Produce a 3–7 sentence high-level summary.

      PURPOSE PRIORITY (do NOT violate this order):
      1. PROGRAM NARRATIVE / DESCRIPTION / OPERATING INSTRUCTIONS / REMARKS blocks
         (they are authoritative: do not contradict them)
      2. Key file/record/variable names (especially business terms)
      3. Main driver paragraphs (core PERFORM chains)
      4. Program-ID/source name (may be ambiguous; use with caution)

      CONTENT:
      - Clearly state what the program does, in domain terms.
      - Where it fits in the system (high-level context, not a call dump).
      - 3–7 **specific** key responsibilities derived from:
        - Narrative comments AND
        - Main driver paragraphs
      - High-level summary of external dependencies grouped into:
        - Runtime/Platform/Generator
        - Shared Utility
        - Business/Application

      ANTI-HALLUCINATION:
      - If comments explicitly say "minimum distribution calculation", you MUST NOT
        reinterpret as "minimum distance calculation".
      - If meaning is unclear, say so explicitly.

    template: |
      {{summary_paragraph}}

      **Key Responsibilities:**
      {{responsibilities_list}}

      **External Program Dependencies (Categorized):**
      {{dependencies_list}}

#######################################################################################
# PROGRAM STRUCTURE
#######################################################################################

  - id: program-structure
    title: Program Structure
    instruction: |
      Use ctags metadata to list divisions, sections, and important structures.
      For each, infer purpose using:
      - Narrative comments (preferred)
      - Names and usage
      - Generator patterns (label clearly if generator-produced)

    sections:
      - id: divisions-overview
        title: COBOL Division Structure
        type: table
        columns: [Division, Section/Element, Line Number, Purpose]
        template: |
          | {{division}} | {{section_name}} | {{line_number}} | {{inferred_purpose}} |

      - id: copybooks-referenced
        title: Referenced Copybooks
        instruction: |
          Use superbol_cfg.copybooks[] to list all COPY statements.

          For each copybook:
          - Identify context (section/division).
          - Categorize as Business / Shared Utility / Runtime/Generator using
            dependency_categorization_heuristics.
          - Describe its purpose briefly; if it's clearly generator-provided, say so.

          If no copybooks, say: "No copybooks referenced".
        repeatable: true
        template: |
          ### {{copybook_name}} (Line {{copybook_line}})

          **Context**: {{copybook_context}}
          **Category**: {{copybook_category}}
          **Purpose**: {{copybook_purpose}}

      - id: data-structures
        title: Data Structures
        instruction: |
          Extract all data items (kind: "data") from ctags outline.

          For FILE SECTION / report-like structures with many FILLERs:
          - Treat them as "Generator-driven report layouts" or "Report buffers".
          - Mention that the true layout may be defined in XGEN/UNISYS (or equivalent)
            rather than hand-written COBOL.

          Spend more explanation effort on:
          - Core business records (accounts, policies, distributions, claims, etc.).
          - Control totals and key flags.

        repeatable: true
        template: |
          ### {{data_item_name}} (Line {{line_number}})

          **Level**: {{level}}
          **Picture**: {{picture_clause}}
          **Purpose**: {{inferred_purpose}}
          **Used In**: {{usage_locations}}

#######################################################################################
# DETAILED CODE EXPLANATION (FULL, DIALECT-AGNOSTIC)
#######################################################################################

  - id: detailed-code-explanation
    title: Detailed Code-Block Explanation
    instruction: |
      ═══════════════════════════════════════════════════════════════════════════
      ⚠️  CRITICAL MASTER INSTRUCTIONS — READ CAREFULLY
      ═══════════════════════════════════════════════════════════════════════════

      You will receive *raw COBOL source code* (any dialect) from lines {{start_line}} to 
      {{end_line}} exactly as it appears in the input.

      You have **TWO CRITICAL JOBS**.  
      BOTH jobs are mandatory. BOTH must succeed for output to be valid.

      ⭐ CRITICAL JOB #1 — VERBATIM CODE REPRODUCTION  
         You MUST output the ENTIRE original COBOL source code, exactly as 
         provided, inside ```cobol``` fenced code blocks.  
         This includes every character, every sequence number, every space, 
         every comment, every filler, every table entry, every period, and 
         every division.

      ⭐ CRITICAL JOB #2 — BLOCK-BY-BLOCK CODE EXPLANATION  
         You MUST provide a complete, accurate, and detailed explanation for 
         each logical block (paragraph, section, data group, etc.), and you 
         MUST include a second verbatim code snippet for each block.

      If token limits prevent complete execution of both jobs, apply **Task 
      Priority Rules** below.

      ═══════════════════════════════════════════════════════════════════════════
      🚨 TASK PRIORITY IN CASE OF TOKEN LIMIT PRESSURE
      ═══════════════════════════════════════════════════════════════════════════

      1. CRITICAL JOB #1 — Verbatim reproduction of ALL COBOL lines  
         (This must ALWAYS be completed. If you cannot complete this, you must 
         truncate **explanations**, NOT code.)

      2. CRITICAL JOB #2 — Block-by-block verbatim code + explanation  
         (If token pressure exists, explanations may be shortened, but code 
         reproduction remains mandatory.)

      ⚠️ Under NO circumstances may you:
         - Modify the input code,
         - Omit code,
         - Summarize code,
         - Skip blocks,
         - Produce only explanations without code.

      ═══════════════════════════════════════════════════════════════════════════
      📐 GLOBAL OUTPUT STRUCTURE (MUST FOLLOW THIS EXACT ORDER)
      ═══════════════════════════════════════════════════════════════════════════

      --------------------------------------------------------------------------
      ## COBOL Code (Complete Verbatim Copy)

      ```cobol
      [EVERY LINE EXACTLY AS RECEIVED IN INPUT — VERBATIM, NO CHANGES]
      ```

      --------------------------------------------------------------------------
      ## Explanation by Block

      For EACH logical block in the program:

      ### Block N: [BLOCK-NAME] (Lines X–Y)

      ```cobol
      [EXACT LINES X–Y FROM THE ORIGINAL INPUT — VERBATIM]
      ```

      **Purpose:**
      - High-level summary of what the block accomplishes.

      **Detailed Explanation:**
      - What each line does  
      - Functional role  
      - Execution flow  
      - Conditional logic and branches  
      - Variables and data elements used  
      - Data transformations  
      - File interactions  
      - External calls  
      - Error handling (if any)

      **Technical Details:**
      - Variables used  
      - Called by  
      - Calls  
      - Side effects  

      --------------------------------------------------------------------------
      ## Coverage Self-Assessment

      Use the EXACT template below:

      ---
      ## Coverage Self-Assessment

      **Code Blocks Generated:**
      1. Block 1: [NAME] (Lines X–Y) - N lines
      2. Block 2: [NAME] (Lines A–B) - M lines
      ... (list all blocks)

      **Total Lines in My Code Blocks:** [NUMBER]

      **Lines I Intentionally Excluded:**
      - Comment lines (marked with * or *> or *>* in area A/column 7): [COUNT]
      - Page breaks (marked with / in column 7, if present): [COUNT]
      - Total excluded: [NUMBER]

      **My Calculation:**
      - Source chunk contained: {{line_count}} total lines (lines {{start_line}}–{{end_line}})
      - I included: [NUMBER] executable lines in my code blocks
      - I excluded: [NUMBER] comment/page-break lines
      - Expected executable: {{line_count}} – [excluded count]
      - My self-assessed coverage: [NUMBER]%

      ⚠️ This section must appear LAST in this chunk. No text may follow it.
      ---

      ═══════════════════════════════════════════════════════════════════════════
      📌 ABSOLUTE REQUIREMENTS FOR CODE REPRODUCTION (CRITICAL JOB #1)
      ═══════════════════════════════════════════════════════════════════════════

      ✔ MUST copy every character exactly as input  
      ✔ MUST preserve spacing, indentation, alignment, sequence numbers  
      ✔ MUST include:
         - IDENTIFICATION DIVISION (ALL lines)
         - ENVIRONMENT DIVISION (ALL lines)
         - DATA DIVISION (ALL lines)
             → All FD’s  
             → All 01/05/10/15/77 levels  
             → All FILLER lines  
             → All OCCURS tables  
             → All REDEFINES  
         - PROCEDURE DIVISION (ALL lines)
             → Every statement  
             → Every continuation line  
             → Every period

      ✔ MUST wrap all code in ```cobol``` blocks
      ✔ MUST include at least one ```cobol``` code block

      ❌ MUST NOT:
         - Alter code  
         - Summarize code  
         - Compress or combine lines  
         - Invent missing lines  
         - Add or remove spaces  
         - Add commentary inside ```cobol``` blocks  

      ═══════════════════════════════════════════════════════════════════════════
      📌 REQUIREMENTS FOR BLOCK EXPLANATIONS (CRITICAL JOB #2)
      ═══════════════════════════════════════════════════════════════════════════

      ✔ MUST include each block’s code (verbatim) in its own ```cobol``` block  
      ✔ MUST provide a detailed explanation for each block  
      ✔ MUST cover: logic, flow, variables, I/O, calls, transformations  

      ⚠️ Explanation content may be shortened ONLY if token limits force it.

      ❌ Explanations may NOT replace code.  
      ❌ Blocks may NOT be skipped.  

      ═══════════════════════════════════════════════════════════════════════════
      🚫 FORBIDDEN KEYWORDS (CAUSES AUTOMATIC VALIDATION FAILURE)
      ═══════════════════════════════════════════════════════════════════════════

      The following MUST NOT appear in ANY code section:

      - “omitted”  
      - “skipped”  
      - “similar”  
      - “pattern continues”  
      - “pattern repeats”  
      - “...” for omission  

      ═══════════════════════════════════════════════════════════════════════════
      🔍 EXECUTABLE LINE COVERAGE REQUIREMENT
      ═══════════════════════════════════════════════════════════════════════════

      - Automated validation counts every executable COBOL line in your output.
      - Expected executable lines = {{line_count}} – [excluded comment/page-break lines]
      - Your included lines / expected lines must be == 100%.

      ═══════════════════════════════════════════════════════════════════════════
      🧠 FINAL REMINDERS
      ═══════════════════════════════════════════════════════════════════════════

      - You must always complete BOTH CRITICAL JOBS unless token limits are exceeded.
      - If forced to choose due to output length, ALWAYS complete CRITICAL JOB #1 first.
      - Never alter or summarize code.
      - Never omit explanations unless token limit requires — and even then, reproduce all code.
      - The validator checks code fidelity, block coverage, and == 100% line coverage.

      ═══════════════════════════════════════════════════════════════════════════
      🎯 SUCCESS METRIC: Perfect Verbatim Code + Complete Block Explanations
      ═══════════════════════════════════════════════════════════════════════════
    template: |
      The following analysis covers the entire source code sequentially, from the first line to the last.
      Each numbered item represents a paragraph or logically grouped set of paragraphs that implement a single functionality.

      {{comprehensive_code_explanations}}

      ---

      ## Chunk Completion Checklist

      The following paragraphs were documented in this chunk:

      {{paragraph_checklist}}

#######################################################################################
# CONTROL FLOW ANALYSIS (CFG – HIGH-LEVEL ONLY)
#######################################################################################

  - id: control-flow-analysis
    title: Control Flow Analysis
    instruction: |
      Use SuperBol CFG JSON to describe control flow.

      IMPORTANT:
      - Do NOT attempt to render the **full** CFG in Mermaid. It will be unreadable
        and likely break VSCode preview.
      - The diagrams MUST show a **high-level view**:
        - Initialization
        - Main business driver(s)
        - Key loops/branches
        - Error handling
        - Cleanup

      All full detail (paragraph-by-paragraph) belongs in tables and textual sections,
      not in Mermaid diagrams.

    sections:
      - id: cfg-with-calls-diagram
        title: High-Level Control Flow with External Calls
        type: mermaid
        mermaid_type: graph
        instruction: |
          Generate a **simplified** Mermaid `graph LR` diagram.

          CONTENT RULES:
          - Include:
            - 1–3 entry/initialization paragraphs
            - 3–10 main business paragraphs
            - 1–3 error/cleanup paragraphs
          - Aggregate many small generator/library paragraphs into ONE node
            (e.g., LIBRARY_SUPPORT["Library / Runtime Routines"]).

          MERMAID SYNTAX RULES (SEE GLOBAL GUIDELINES, MUST OBEY):
          - Use:
              ```mermaid
              graph LR
                NODE_ID["Label"]
                NODE_A --> NODE_B
              ```
          - NODE_ID must be alphanumeric + underscore only.
          - Labels must NOT contain HTML, backticks, or quotes.
          - Line numbers, counts, and details MUST be simplified; if necessary,
            move detailed lists into surrounding markdown text instead of labels.
          - Edge labels (if used) must be compact tokens like 16x_CURRENT_DATE
            (letters/digits/underscores only; no spaces, commas, or parentheses).

          External calls:
          - Represent external programs as nodes with category-based classes:
            - runtime, utility, business
          - Use dashed edges for calls:
            - PARA_MAIN -.->|16x_CURRENT_DATE| RUNTIME_DATE
          - Keep the total number of nodes and edges small and readable.

        template: |
          ```mermaid
          graph LR
            {{paragraph_nodes_with_calls}}

            classDef external fill:#aff,stroke:#06c,stroke-width:2px;
            classDef paragraph fill:#fff,stroke:#333,stroke-width:1px;
            classDef library fill:#eee,stroke:#999,stroke-width:1px,font-style:italic;
            {{styling_classes}}
          ```

      - id: external-call-context
        title: External Call Context
        instruction: |
          Use superbol_cfg.calls[].

          For each call:
          - Determine category using dependency_categorization_heuristics:
            Runtime/Platform/Generator, Shared Utility, Business/Application.
          - Group calls by calling paragraph.

        template: |
          ### External Calls by Paragraph

          {{external_calls_by_paragraph}}

      - id: paragraph-complexity
        title: Paragraph Complexity & Business Role
        type: table
        columns: [Paragraph, Line, Performs, External Calls, Total Edges, Complexity, Role]
        instruction: |
          Complexity (Low/Medium/High) is structural.
          Role is semantic:
          - Main business driver
          - Supporting business logic
          - Error/validation
          - Generator/library

          Generator/library paragraphs (ENDIF stubs, XGEN boilerplate, etc.) MUST be
          marked as "Generator/library" even if they have many edges.

        template: |
          | {{paragraph}} | {{line}} | {{perform_count}} | {{call_count}} | {{total_edges}} | {{complexity_level}} | {{role}} |

#######################################################################################
# DATA FLOW ANALYSIS (DFG – HIGH-LEVEL ONLY)
#######################################################################################

  - id: data-flow-analysis
    title: Data Flow Analysis
    instruction: |
      Treat this as a high-level DFG.

      Focus on 5–15 key business data elements (e.g., distribution amounts, balances,
      statuses, dates) and show how they flow:
      - Inputs (files, LINKAGE, ACCEPT)
      - Processing paragraphs
      - Outputs (files, reports, external calls)

      Do NOT attempt to include every minor variable in diagrams.

    sections:
      - id: dfa-diagram
        title: Data Flow Diagram (Key Items)
        type: mermaid
        mermaid_type: graph
        instruction: |
          Generate a Mermaid `graph LR` diagram that shows:

          - Source nodes: input files, linkage records, constants.
          - Process nodes: main paragraphs where key data is computed or transformed.
          - Sink nodes: output files, reports, external calls.

          Follow global Mermaid syntax rules:
          - IDs: letters/digits/underscore only.
          - Node definitions:
              ID["Human-readable label\noptional second line"]
          - NO HTML tags, NO `<br/>`, NO quotes inside labels.
          - If you need to show call counts or line numbers, keep labels short
            (e.g., "CURRENT_DATE\n16 calls") and explain detailed line lists
            in normal markdown text outside the diagram.
          - Edge labels, if used, must be compact tokens like 1x_MOVE or 3x_COMPUTE.

        template: |
          ```mermaid
          graph LR
            {{dfa_mermaid_content}}
          ```

      - id: data-transformations
        title: Data Transformations
        instruction: |
          For each key transformation:
          - Identify source and target data items.
          - Note operation type (MOVE, COMPUTE, STRING, UNSTRING, etc.).
          - Explain business purpose briefly.

        repeatable: true
        template: |
          **{{transformation_step}}**: {{source_data}} → {{target_data}}
          - Location: Line {{line_number}}
          - Operation: {{operation_type}}
          - Purpose: {{inferred_purpose}}

#######################################################################################
# INTER-PROGRAM COMMUNICATION (DEPENDENCY-AWARE)
#######################################################################################

  - id: inter-program-communication
    title: Inter-Program Communication
    instruction: |
      Use superbol_cfg.calls[] and gnucobol_analysis (if available).

      For EACH external program:
      - Classify as Runtime/Platform/Generator, Shared Utility, or Business/Application
        using dependency_categorization_heuristics.
      - Make this classification explicit; this is crucial for modernization projects.

    sections:
      - id: call-frequency-heatmap
        title: Call Frequency & Category
        type: table
        columns: [Program, Category, Call Count, Called From, Importance]
        instruction: |
          Importance:
          - 🔥 Critical – high call count OR central to business purpose
          - ⚠️ High – frequent but not strictly core
          - ℹ️ Medium – occasional use

        template: |
          | {{program_name}} | {{category}} | {{call_count}} | {{calling_paragraphs}} | {{importance}} |

      - id: program-call-diagram
        title: Program Call Hierarchy
        type: mermaid
        mermaid_type: graph
        instruction: |
          Create a high-level dependency diagram only (no internal CFG here).

          - Center node: current program as a single fixed ID (e.g., CURRENT_PROG)
            with the label set to {{program_name}}.
          - One node per external program (optionally aggregate many runtime libs into
            a single node like RUNTIME_SERVICES).
          - Use dashed edges with simple, compact edge labels for call frequency
            (e.g., 16x_CURRENT_DATE, 2x_XSTRPAT).
          - Edge labels must not contain spaces, commas, parentheses, or colons.

          Follow Mermaid syntax guidelines:
          - Use:
              ```mermaid
              graph LR
                CURRENT_PROG["{{program_name}}"]
                RUNTIME_SERVICES["Runtime/Platform Services"]
                CURRENT_PROG -.->|16x_CURRENT_DATE| RUNTIME_SERVICES
              ```
          - Node IDs (CURRENT_PROG, RUNTIME_SERVICES, etc.) must be safe identifiers.

        template: |
          ```mermaid
          graph LR
            CURRENT_PROG["{{program_name}}"]
            {{called_program_nodes}}
            {{call_relationships_with_frequency}}

            classDef current fill:#f9f,stroke:#333,stroke-width:4px;
            classDef runtime fill:#ddd,stroke:#333,stroke-width:1px;
            classDef utility fill:#fc9,stroke:#333,stroke-width:1px;
            classDef business fill:#9cf,stroke:#333,stroke-width:2px;
            class CURRENT_PROG current;
            {{frequency_styling}}
          ```

      - id: call-details-with-context
        title: Detailed Call Analysis
        instruction: |
          For each external program:
          - List calling paragraphs + line numbers.
          - Show category and likely purpose.
          - Explain how critical it is to the business function of this program.

        repeatable: true
        template: |
          ### {{called_program_name}} ({{category}})

          **This Program's Usage**:
          - Call Count: {{local_call_count}}
          - Called From:
            {{paragraph_and_line_list}}

          **Purpose & Integration**:
          {{inferred_purpose_and_integration}}

#######################################################################################
# BUSINESS LOGIC EXPLANATION
#######################################################################################

  - id: business-logic
    title: Business Logic Explanation
    instruction: |
      Synthesize narrative comments, CFG, DFG, and dependency analysis to explain
      how the program actually does its job.

      Explicitly identify:
      - Initialization chain
      - Main business processing
      - Error/exception handling
      - Cleanup and reporting

    sections:
      - id: execution-flow-sequence
        title: Execution Flow Sequence
        type: mermaid
        mermaid_type: sequence
        instruction: |
          Create a sequence diagram for the main path only (no full CFG).

          Participants:
          - User (or Upstream Job/System)
          - Current program
          - Key external programs (at most 3–7)

          Mermaid sequence syntax and global guidelines:
          - Use:
              ```mermaid
              sequenceDiagram
                participant USER
                participant PROG as "{{program_name}}"
                participant RUNTIME_SVC as "Runtime Services"
                USER->>PROG: Start batch
                PROG->>RUNTIME_SVC: 16x CURRENT_DATE
              ```
          - Participant IDs (USER, PROG, RUNTIME_SVC, etc.) must be safe identifiers
            (letters/digits/underscore only).
          - Use `as "Label"` if the label (e.g., {{program_name}}) may contain spaces
            or hyphens.
          - Message text:
            - May contain spaces.
            - MUST NOT contain backticks, `<br/>`, or template fences.
            - Keep it short and descriptive.

        template: |
          ```mermaid
          sequenceDiagram
            participant USER
            participant PROG as "{{program_name}}"
            {{external_program_participants}}

            {{detailed_execution_sequence}}
          ```

      - id: business-operations-catalog
        title: Business Operations Catalog
        instruction: |
          Group related paragraphs into business operations (e.g., "Calculate RMD",
          "Generate control report").

          Use:
          - Program narrative
          - Paragraph names
          - CFG/DFG context

        repeatable: true
        template: |
          ### {{operation_name}}

          **Business Purpose**: {{business_purpose}}

          **Implementation**:
          - Primary Paragraph: {{primary_paragraph}} (Line {{line}})
          - Supporting Paragraphs: {{supporting_paragraphs}}

          **Data Requirements**:
          {{required_data_items}}

          **External Dependencies**:
          {{external_programs_called}}

          **Process Flow**:
          {{step_by_step_flow}}

          **Error Handling**:
          {{error_handling_approach}}

#######################################################################################
# ERROR HANDLING
#######################################################################################

  - id: error-handling
    title: Error Handling Strategy
    instruction: |
      Document:
      - Error/status variables
      - Dedicated error paragraphs
      - External error handlers (if any)
      - Validation points and outcomes

    template: |
      **Error Code Variables**: {{error_variables}}

      **Error Handling Approach**:
      {{error_handling_description}}

      **Validation Points**:
      {{validation_points}}

      **Error Handler Invocations**:
      {{error_handler_calls}}

#######################################################################################
# TECHNICAL DETAILS
#######################################################################################

  - id: technical-details
    title: Technical Details
    instruction: |
      Provide concise technical metrics and dependency overview.

    sections:
      - id: code-metrics
        title: Code Metrics
        type: table
        columns: [Metric, Value]
        template: |
          | {{metric_name}} | {{metric_value}} |

      - id: dependencies-matrix
        title: Dependencies Matrix
        type: table
        columns: [Dependency Type, Name, Category, Count, Lines]
        template: |
          | {{dependency_type}} | {{dependency_name}} | {{dependency_category}} | {{usage_count}} | {{line_numbers}} |

#######################################################################################
# CODE REFERENCES & METADATA APPENDIX
#######################################################################################

  - id: code-references
    title: Code References
    instruction: |
      Provide quick links to important areas of the source (by line range or paragraph).

    template: |
      ### Quick Reference Links

      {{code_reference_links}}

  - id: metadata-appendix
    title: Appendix - Metadata Summary
    instruction: |
      Summarize analysis metadata for transparency and debugging.

    sections:
      - id: superbol-summary
        title: Control Flow Analysis Metadata
        template: |
          **Symbols Found**: {{symbol_count}}
          **CFG Nodes**: {{cfg_node_count}}
          **CFG Edges**: {{cfg_edge_count}}
          **External Calls**: {{external_call_count}}

      - id: gnucobol-summary
        title: Semantic Analysis Metadata
        template: |
          **Program ID**: {{gnucobol_program_id}}
          **Total Calls**: {{gnucobol_call_count}}
          **Unique Programs Called**: {{gnucobol_unique_programs}}
          **Analysis Success**: {{gnucobol_success}}

      - id: ctags-summary
        title: Symbol Parser Metadata
        template: |
          **Total Symbols**: {{ctags_symbol_count}}
          **Divisions**: {{ctags_division_count}}
          **Paragraphs**: {{ctags_paragraph_count}}
          **Data Items**: {{ctags_data_count}}
