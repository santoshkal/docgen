# COBOL Code Documentation Template (BMAD-METHOD Inspired)
# This template ensures consistent documentation generation across COBOL projects

template:
  id: cobol-documentation-template-v1
  name: COBOL Code Documentation
  version: 1.0
  output:
    format: markdown
    filename: "docs/{{program_name}}-documentation.md"
    title: "{{program_name}} - Code Documentation"

workflow:
  mode: automated
  metadata_sources:
    - superbol_symbols
    - superbol_cfg
    - gnucobol_analysis
    - ctags_outline

sections:
  - id: document-header
    title: "Document Header"
    instruction: |
      Extract program name from metadata and create document header.
      Include generation timestamp and metadata sources used.

      **IMPORTANT:** Replace ALL template variables with actual values:
      - {{program_name}} must be replaced with the actual program ID
      - Do NOT leave any {{placeholder}} text in the output
    sections:
      - id: metadata-info
        title: Document Information
        template: |
          **Generated**: {{generation_timestamp}}
          **Program ID**: {{program_name}}
          **Source File**: {{source_file_path}}
          **Metadata Sources**: Static code analysis, semantic analysis, and symbol parsing

  - id: executive-summary
    title: Executive Summary
    instruction: |
      Analyze all metadata to create a 3-5 sentence high-level overview:
      1. What does this program do? (infer from program calls and structure)
      2. Where does it fit in the system? (check gnucobol program_calls)
      3. Key responsibilities (analyze main paragraphs from ctags)
      4. External dependencies (list programs called)

      **CRITICAL - Extract External Program Calls:**
      Look in superbol_cfg JSON for the "calls" array:
      - superbol_cfg.calls[] contains external program calls
      - Each call has: from (calling paragraph), to (program name), line (line number)
      - If calls[] array exists and has entries, list ALL programs called
      - Format: "PROGRAM-NAME (called from paragraph-name at line N)"
      - If calls[] is empty or missing, state "None found in metadata"

      Example:
      If superbol_cfg.calls = [{"from": "PARA-1", "to": "PROG-A", "line": 123}]
      Then output: "PROG-A (called from PARA-1 at line 123)"
    template: |
      {{summary_paragraph}}

      **Key Responsibilities:**
      {{responsibilities_list}}

      **External Program Dependencies:**
      {{dependencies_list}}

  - id: business-purpose-explanation
    title: Business Purpose Explanation
    instruction: |
      ═══════════════════════════════════════════════════════════════════════════
      BUSINESS PERSPECTIVE ANALYSIS
      ═══════════════════════════════════════════════════════════════════════════

      Provide a COMPREHENSIVE explanation of this program from a PURE BUSINESS
      PERSPECTIVE. This section is for business analysts, stakeholders, and
      non-technical readers who need to understand WHAT this program does and
      WHY it exists - without getting into technical implementation details.

      **ANALYSIS APPROACH:**

      1. **INFER THE BUSINESS DOMAIN**
         - Analyze program name, data structures, and called programs
         - Identify the business domain (banking, insurance, retail, manufacturing, etc.)
         - Look for domain-specific terminology in variable names and copybooks
         - Examples: ACCT → Account Management, CUST → Customer Service,
                     TRAN → Transaction Processing, RPT → Reporting

      2. **IDENTIFY BUSINESS FUNCTIONS**
         From the metadata, determine what business operations this program performs:
         - Data entry / validation
         - Transaction processing
         - Report generation
         - Batch processing (EOD, month-end, etc.)
         - Customer/account management
         - Financial calculations
         - Audit/compliance logging

      3. **EXPLAIN THE BUSINESS VALUE**
         Why does this program exist? What business problem does it solve?
         - What would happen if this program didn't exist?
         - Who are the business users/beneficiaries?
         - What business process does it support?

      4. **DESCRIBE BUSINESS WORKFLOWS**
         How does this program fit into larger business processes?
         - What triggers this program to run?
         - What business outcomes result from its execution?
         - What downstream processes depend on it?

      5. **IDENTIFY BUSINESS RULES**
         From the code structure and data validation, infer business rules:
         - Validation requirements (what makes data valid/invalid)
         - Calculation rules (interest rates, fees, discounts)
         - Business constraints and limits
         - Conditional processing logic

      **DATA SOURCES TO ANALYZE:**
      - Program name and ID (clues to business function)
      - superbol_cfg.calls[] → What other programs it interacts with
      - superbol_cfg.copybooks[] → Shared business data structures
      - gnucobol_analysis.relationships → File I/O and dependencies
      - ctags_outline → Paragraph names often reveal business steps

      **OUTPUT FORMAT:**
      Write in clear, business-friendly language. Avoid technical jargon.
      Use concrete examples where possible. Structure the explanation so a
      business stakeholder can understand the program's role in the organization.

    sections:
      - id: business-domain
        title: Business Domain & Context
        instruction: |
          Identify and explain the business domain this program operates in.

          Consider:
          - What industry or business area does this serve?
          - What department would own this functionality?
          - What business terminology is used in the code?
        template: |
          **Industry/Domain**: {{business_domain}}

          **Business Area**: {{business_area}}

          {{domain_context_explanation}}

      - id: business-functionality
        title: Business Functionality
        instruction: |
          Explain what this program does in pure business terms.

          Answer these questions:
          - What business task does this program accomplish?
          - What inputs does it need (in business terms, not technical)?
          - What outputs or results does it produce?
          - Who uses or benefits from this program's output?

          Write as if explaining to a business manager who has never seen code.
        template: |
          ### What This Program Does

          {{functionality_explanation}}

          ### Business Inputs
          {{business_inputs}}

          ### Business Outputs
          {{business_outputs}}

          ### Business Users & Beneficiaries
          {{business_users}}

      - id: business-value
        title: Business Value & Purpose
        instruction: |
          Explain WHY this program exists and what value it provides.

          Consider:
          - What business problem does it solve?
          - What would happen if this program didn't exist?
          - How does it contribute to business efficiency or compliance?
          - What cost savings or revenue impact does it enable?
        template: |
          ### Business Problem Addressed
          {{business_problem}}

          ### Value Proposition
          {{value_proposition}}

          ### Business Impact
          {{business_impact}}

      - id: business-workflow
        title: Business Workflow Integration
        instruction: |
          Explain how this program fits into larger business processes.

          From the call graph and relationships, describe:
          - What business event or process triggers this program?
          - What business steps happen before this program runs?
          - What business steps happen after this program completes?
          - What business decisions depend on this program's output?

          Use a workflow narrative or process flow description.
        template: |
          ### Process Trigger
          {{process_trigger}}

          ### Upstream Dependencies
          {{upstream_processes}}

          ### Downstream Processes
          {{downstream_processes}}

          ### Business Process Flow
          {{business_process_flow}}

      - id: business-rules
        title: Business Rules & Logic
        instruction: |
          Identify and explain the business rules embedded in this program.

          From the code structure and data validation patterns, infer:
          - Validation rules (what makes data acceptable)
          - Calculation formulas (how amounts are computed)
          - Business constraints (limits, thresholds, conditions)
          - Decision logic (when different paths are taken)

          Express these as business policies, not code logic.
        template: |
          ### Validation Rules
          {{validation_rules}}

          ### Calculation Rules
          {{calculation_rules}}

          ### Business Constraints
          {{business_constraints}}

          ### Decision Criteria
          {{decision_criteria}}

  - id: program-structure
    title: Program Structure
    instruction: |
      Parse ctags outline JSON to extract and document COBOL divisions and sections.
      For each division, list contained sections and data items.
    sections:
      - id: divisions-overview
        title: COBOL Division Structure
        type: table
        columns: [Division, Section/Element, Line Number, Purpose]
        instruction: |
          Extract from ctags-outline.json:
          - IDENTIFICATION DIVISION → PROGRAM-ID, AUTHOR
          - ENVIRONMENT DIVISION → CONFIGURATION SECTION
          - DATA DIVISION → WORKING-STORAGE SECTION (data items)
          - PROCEDURE DIVISION → Paragraphs
        template: |
          | {{division}} | {{section_name}} | {{line_number}} | {{inferred_purpose}} |

      - id: copybooks-referenced
        title: Referenced Copybooks
        instruction: |
          **CRITICAL - Extract Copybook Information:**
          Look in superbol_cfg JSON for the "copybooks" array:
          - superbol_cfg.copybooks[] contains all COPY statements
          - Each copybook has: name, line (where COPY appears), context (section name)

          For EACH copybook in the array, create documentation:
          1. Copybook name
          2. Line number where COPY statement appears
          3. Context (which DIVISION/SECTION: WORKING-STORAGE, LINKAGE, etc.)
          4. Inferred purpose based on name

          If copybooks[] array is empty or missing, output: "No copybooks referenced"
          If copybooks[] has entries, list ALL copybooks found

          Example output for copybook:
          ### CUSTOMER-RECORD (Line 27)
          **Context**: WORKING-STORAGE SECTION
          **Purpose**: Customer data structure with ID, name, address fields
        repeatable: true
        template: |
          ### {{copybook_name}} (Line {{copybook_line}})

          **Context**: {{copybook_context}}
          **Purpose**: {{copybook_purpose}}

      - id: data-structures
        title: Data Structures
        instruction: |
          Extract all data items (kind: "data") from ctags outline.
          Group by level (01, 05, 88, etc.) and explain purpose.
        repeatable: true
        template: |
          ### {{data_item_name}} (Line {{line_number}})

          **Level**: {{level}}
          **Picture**: {{picture_clause}}
          **Purpose**: {{inferred_purpose}}
          **Used In**: {{usage_locations}}

  - id: detailed-code-explanation
    title: Detailed Code-Block Explanation
    instruction: |
      ═══════════════════════════════════════════════════════════════════════════
      ⚠️  CRITICAL MASTER INSTRUCTIONS — READ CAREFULLY
      ═══════════════════════════════════════════════════════════════════════════

      You will receive *raw COBOL-74 source code* from lines {{start_line}} to 
      {{end_line}} exactly as it appears in the input.

      You have **TWO CRITICAL JOBS**.  
      BOTH jobs are mandatory. BOTH must succeed for output to be valid.

      ⭐ CRITICAL JOB #1 — VERBATIM CODE REPRODUCTION  
         You MUST output the ENTIRE original COBOL source code, exactly as 
         provided, inside ```cobol``` fenced code blocks.  
         This includes every character, every sequence number, every space, 
         every comment, every filler, every table entry, every period, and 
         every division.

      ⭐ CRITICAL JOB #2 — BLOCK-BY-BLOCK CODE EXPLANATION  
         You MUST provide a complete, accurate, and detailed explanation for 
         each logical block (paragraph, section, data group, etc.), and you 
         MUST include a second verbatim code snippet for each block.

      If token limits prevent complete execution of both jobs, apply **Task 
      Priority Rules** below.

      ═══════════════════════════════════════════════════════════════════════════
      🚨 TASK PRIORITY IN CASE OF TOKEN LIMIT PRESSURE
      ═══════════════════════════════════════════════════════════════════════════

      1. CRITICAL JOB #1 — Verbatim reproduction of ALL COBOL lines  
         (This must ALWAYS be completed. If you cannot complete this, you must 
         truncate **explanations**, NOT code.)

      2. CRITICAL JOB #2 — Block-by-block verbatim code + explanation  
         (If token pressure exists, explanations may be shortened, but code 
         reproduction remains mandatory.)

      ⚠️ Under NO circumstances may you:
         - Modify the input code,
         - Omit code,
         - Summarize code,
         - Skip blocks,
         - Produce only explanations without code.

      ═══════════════════════════════════════════════════════════════════════════
      📐 GLOBAL OUTPUT STRUCTURE (MUST FOLLOW THIS EXACT ORDER)
      ═══════════════════════════════════════════════════════════════════════════

      --------------------------------------------------------------------------
      ## COBOL Code (Complete Verbatim Copy)

      ```cobol
      [EVERY LINE EXACTLY AS RECEIVED IN INPUT — VERBATIM, NO CHANGES]
      ```

      --------------------------------------------------------------------------
      ## Explanation by Block

      For EACH logical block in the program:

      ### Block N: [BLOCK-NAME] (Lines X–Y)

      ```cobol
      [EXACT LINES X–Y FROM THE ORIGINAL INPUT — VERBATIM]
      ```

      **Purpose:**
      - High-level summary of what the block accomplishes.

      **Detailed Explanation:**
      - What each line does  
      - Functional role  
      - Execution flow  
      - Conditional logic and branches  
      - Variables and data elements used  
      - Data transformations  
      - File interactions  
      - External calls  
      - Error handling (if any)

      **Technical Details:**
      - Variables used  
      - Called by  
      - Calls  
      - Side effects  

      --------------------------------------------------------------------------
      ## Coverage Self-Assessment

      Use the EXACT template below:

      ---
      ## Coverage Self-Assessment

      **Code Blocks Generated:**
      1. Block 1: [NAME] (Lines X-Y) - N lines
      2. Block 2: [NAME] (Lines A-B) - M lines
      ... (list all blocks)

      **Total Lines in My Code Blocks:** [NUMBER]

      **Lines I Intentionally Excluded:**
      - Comment lines (marked with * in column 7): [COUNT]
      - Page breaks (marked with / in column 7): [COUNT]
      - Total excluded: [NUMBER]

      **My Calculation:**
      - Source chunk contained: {{line_count}} total lines (lines {{start_line}}–{{end_line}})
      - I included: [NUMBER] executable lines in my code blocks
      - I excluded: [NUMBER] comment/page-break lines
      - Expected executable: {{line_count}} – [excluded count]
      - My self-assessed coverage: [NUMBER]%

      ⚠️ This section must appear LAST. No text may follow it.
      ---

      ═══════════════════════════════════════════════════════════════════════════
      📌 ABSOLUTE REQUIREMENTS FOR CODE REPRODUCTION (CRITICAL JOB #1)
      ═══════════════════════════════════════════════════════════════════════════

      ✔ MUST copy every character exactly as input  
      ✔ MUST preserve spacing, indentation, alignment, sequence numbers  
      ✔ MUST include:
         - IDENTIFICATION DIVISION (ALL lines)
         - ENVIRONMENT DIVISION (ALL lines)
         - DATA DIVISION (ALL lines)
             → All FD’s  
             → All 01/05/10/15/77 levels  
             → All FILLER lines  
             → All OCCURS tables  
             → All REDEFINES  
         - PROCEDURE DIVISION (ALL lines)
             → Every statement  
             → Every continuation line  
             → Every period

      ✔ MUST wrap all code in ```cobol``` blocks
      ✔ MUST include at least one ```cobol``` code block

      ❌ MUST NOT:
         - Alter code  
         - Summarize code  
         - Compress or combine lines  
         - Invent missing lines  
         - Add or remove spaces  
         - Add commentary inside ```cobol``` blocks  

      ═══════════════════════════════════════════════════════════════════════════
      📌 REQUIREMENTS FOR BLOCK EXPLANATIONS (CRITICAL JOB #2)
      ═══════════════════════════════════════════════════════════════════════════

      ✔ MUST include each block’s code (verbatim) in its own ```cobol``` block  
      ✔ MUST provide a detailed explanation for each block  
      ✔ MUST cover: logic, flow, variables, I/O, calls, transformations  

      ⚠️ Explanation content may be shortened ONLY if token limits force it.

      ❌ Explanations may NOT replace code.  
      ❌ Blocks may NOT be skipped.  

      ═══════════════════════════════════════════════════════════════════════════
      🚫 FORBIDDEN KEYWORDS (CAUSES AUTOMATIC VALIDATION FAILURE)
      ═══════════════════════════════════════════════════════════════════════════

      The following MUST NOT appear in ANY code section:

      - “omitted”  
      - “skipped”  
      - “similar”  
      - “pattern continues”  
      - “pattern repeats”  
      - “...” for omission  

      ═══════════════════════════════════════════════════════════════════════════
      🔍 EXECUTABLE LINE COVERAGE REQUIREMENT
      ═══════════════════════════════════════════════════════════════════════════

      - Automated validation counts every executable COBOL line in your output.
      - Expected executable lines = {{line_count}} – [excluded comment/page-break lines]
      - Your included lines / expected lines must be == 100%.

      ═══════════════════════════════════════════════════════════════════════════
      🧠 FINAL REMINDERS
      ═══════════════════════════════════════════════════════════════════════════

      - You must always complete BOTH CRITICAL JOBS unless token limits are exceeded.
      - If forced to choose due to output length, ALWAYS complete CRITICAL JOB #1 first.
      - Never alter or summarize code.
      - Never omit explanations unless token limit requires — and even then, reproduce all code.
      - The validator checks code fidelity, block coverage, and == 100% line coverage.

      ═══════════════════════════════════════════════════════════════════════════
      🎯 SUCCESS METRIC: Perfect Verbatim Code + Complete Block Explanations
      ═══════════════════════════════════════════════════════════════════════════
    template: |
      The following analysis covers the entire source code sequentially, from the first line to the last.
      Each numbered item represents a paragraph or logically grouped set of paragraphs that implement a single functionality.

      {{comprehensive_code_explanations}}

      ---

      ## Chunk Completion Checklist

      The following paragraphs were documented in this chunk:

      {{paragraph_checklist}}

  - id: control-flow-analysis
    title: Control Flow Analysis
    instruction: |
      Use SuperBol CFG JSON to create detailed control flow documentation with external call context.

      **PROGRAM MAP CONTEXT:**
      A program_map is provided showing the entire program structure with ranked paragraphs.
      Use this to understand the overall control flow and identify the most important paragraphs.
      The map shows which paragraphs are most frequently called (highest importance scores).

      **CRITICAL - MUST EXTRACT EXTERNAL CALLS:**
      The superbol_cfg JSON has a "calls" array that you MUST extract:

      1. Look for superbol_cfg.calls[] array in the metadata
      2. If calls[] exists and has entries, you MUST include them in the diagram
      3. Each call object has: {"from": "paragraph", "to": "program-name", "line": number}
      4. Show calls as DASHED ARROWS (-.->|"call line N"|) in Mermaid diagrams
      5. If calls[] is empty, state "No external calls found"

      CRITICAL: Extract from superbol_cfg:
      - nodes[]: All paragraphs with name, type, line
      - edges[]: Internal flow (perform relationships)
      - **calls[]: External program calls with from/to/line** ← MUST USE THIS
      - performs[]: Explicit perform statements with from/to/line

      Create visualizations showing:
      1. Internal control flow (performs between paragraphs) - solid arrows
      2. External calls WITH line numbers and calling context - dashed arrows
      3. Integration of both in a comprehensive diagram

      Example:
      If calls = [{"from": "PARA-1", "to": "EXTERNAL-PROG", "line": 100}]
      Then diagram MUST include:
      PARA_1 -.->|"call line 100"| EXTERNAL_PROG["`EXTERNAL-PROG<br/>(External)`"]
    sections:
      - id: cfg-with-calls-diagram
        title: Control Flow with External Calls
        type: mermaid
        mermaid_type: graph
        instruction: |
          Generate enhanced Mermaid flowchart from SuperBol CFG showing BOTH internal flow AND external calls:

          **CRITICAL - Mermaid Syntax Sanitization:**
          COBOL paragraph names may contain special characters that break Mermaid syntax.
          You MUST sanitize ALL paragraph names before using them in Mermaid diagrams:

          Sanitization Rules:
          1. Node IDs (before brackets): Use only alphanumeric and underscores [A-Za-z0-9_]
             - Remove or replace: * / " ' \ - and other special chars
             - Example: "L\"S\"/\"GENL\"" becomes LSGENL
          2. Node Labels (inside brackets): Use backtick syntax for any text with special chars
             - Replace " with ' (single quotes)
             - Replace / with - (hyphen)
             - Replace * with - (hyphen)
             - Wrap in backticks: ["`label here`"]
             - Example: L"S"/"GENL" becomes ["`L'S'-'GENL'`"]

          Sanitization Examples:
          - Original: L"S"/"GENL"/"PRINTER-PR"
            Node ID: LSGENLPRINTERPR
            Full syntax: LSGENLPRINTERPR["`L'S'-'GENL'-'PRINTER-PR'`"]

          - Original: 000026*REMARKS
            Node ID: REMARKS_000026
            Full syntax: REMARKS_000026["`000026-REMARKS`"]

          **CRITICAL - EXTRACT superbol_cfg.calls[] array:**
          You MUST look in the metadata for superbol_cfg.calls[]
          If this array exists and has entries, extract EACH call and show in diagram

          From superbol_cfg.calls[], create a diagram showing:
          1. Each paragraph as a node (SANITIZED node ID, original name in backtick label)
          2. PERFORM relationships as solid arrows (-->|perform|)
          3. **CALL relationships as DASHED arrows (-.->|"call line N"|) WITH line numbers**
          4. External programs as nodes with special styling (classDef external)
          5. Group related paragraphs (e.g., INITIALIZE-SYSTEM with its calls)

          Mandatory: If calls[] has entries, you MUST add them to the diagram
          Each call in calls[] array must appear as a dashed arrow in the diagram

          Example structure with sanitization:
          ```
          PARAGRAPH1["`PARAGRAPH-1`"]
          PARAGRAPH1 -->|perform| PARAGRAPH2
          PARAGRAPH1 -.->|"call line 33"| EXTERNALPRG1
          PARAGRAPH1 -.->|"call line 38"| EXTERNALPRG2
          ```

          Use different styles:
          - Solid arrows (-->) for PERFORM
          - Dashed arrows (-.->)for CALL
          - Labels with line numbers
          - Different colors for external programs
        template: |
          ```mermaid
          graph LR
            {{paragraph_nodes_with_calls}}

            classDef external fill:#aff,stroke:#06c,stroke-width:2px
            classDef paragraph fill:#fff,stroke:#333,stroke-width:1px
            {{styling_classes}}
          ```

      - id: external-call-context
        title: External Call Context
        instruction: |
          **CRITICAL - Extract External Calls:**
          Look in superbol_cfg JSON for the "calls" array

          For EACH entry in superbol_cfg.calls[], document:
          - from: calling paragraph name
          - to: external program name
          - line: exact line number where CALL appears

          Create a table or list showing ALL external calls found.

          If calls[] is empty or missing: output "No external calls found in metadata"
          If calls[] has entries: list ALL of them with full details

          Format for each call:
          **Program-Name** (called at line N)
          - Called from: paragraph-name
          - Purpose: [infer from context]

          Document the context: what the calling paragraph does, why it calls this program.
        template: |
          ### External Calls by Paragraph

          {{external_calls_by_paragraph}}

      - id: paragraph-complexity
        title: Paragraph Complexity Analysis
        type: table
        columns: [Paragraph, Line, Performs, External Calls, Total Edges, Complexity]
        instruction: |
          Analyze each paragraph's complexity based on:
          - Number of PERFORM statements (from performs[])
          - Number of external CALLs (from calls[]) ← Count calls where "from" matches paragraph
          - Total edges in/out (from edges[])

          **CRITICAL:** For "External Calls" column:
          Count how many entries in superbol_cfg.calls[] have "from" matching this paragraph
          Example: If paragraph is "PARA-1" and calls = [{"from":"PARA-1", ...}], then call_count = 1

          Classify complexity as: Low (<3), Medium (3-5), High (>5)
        template: |
          | {{paragraph}} | {{line}} | {{perform_count}} | {{call_count}} | {{total_edges}} | {{complexity_level}} |

  - id: data-flow-analysis
    title: Data Flow Analysis
    instruction: |
      Analyze how data flows through the program:
      1. Identify input data (ACCEPT statements, LINKAGE SECTION)
      2. Track data transformations (MOVE, COMPUTE)
      3. Identify output data (DISPLAY, output files)
      4. Document data passing to external programs

      **PROGRAM MAP CONTEXT:**
      A program_map is provided showing the most frequently used data items (ranked by reference count).
      Focus on these high-importance data items when analyzing data flow, as they are central to the program's operation.
    sections:
      - id: dfa-diagram
        title: Data Flow Diagram
        type: mermaid
        mermaid_type: graph
        instruction: |
          Create Mermaid diagram showing:
          - Data sources (input)
          - Processing steps (paragraphs that modify data)
          - Data sinks (output/external calls)

          **CRITICAL:** Apply Mermaid sanitization rules (see cfg-with-calls-diagram section):
          - Node IDs: alphanumeric and underscores only
          - Labels: use backtick syntax ["`label`"] for special characters
          - Replace " with ', / with -, * with -
        template: |
          ```mermaid
          graph LR
            {{dfa_mermaid_content}}
          ```

      - id: data-transformations
        title: Data Transformations
        instruction: |
          Document key data transformations in the program.
          Look for COMPUTE, MOVE, STRING, UNSTRING operations.
        repeatable: true
        template: |
          **{{transformation_step}}**: {{source_data}} → {{target_data}}
          - Location: Line {{line_number}}
          - Operation: {{operation_type}}
          - Purpose: {{inferred_purpose}}

  - id: inter-program-communication
    title: Inter-Program Communication
    instruction: |
      **CRITICAL - Document External Program Calls:**
      This section MUST document all external CALL statements found in metadata.

      PRIMARY SOURCE: superbol_cfg.calls[] array
      - Look in superbol_cfg JSON for the "calls" array
      - Each entry has: {"from": "paragraph", "to": "program-name", "line": number}
      - This is the PRIMARY source for external call documentation

      SECONDARY SOURCE: gnucobol_analysis (if available and success=true)
      - program_calls[program_name]: List of ALL programs this program calls
      - call_summary.call_counts: Frequency of each program call across entire system
      - per_file_analysis: Detailed call information

      **If superbol_cfg.calls[] has entries, you MUST document them**
      **If gnucobol_analysis has program_calls, use for additional context**
      **If BOTH are empty/missing, state: "No external program calls found"**

      Create THREE levels of documentation:
      1. This program's direct dependencies (from superbol_cfg.calls[])
      2. System-wide call frequency (from gnucobol if available)
      3. Detailed call context from each paragraph (from superbol_cfg.calls[])
    sections:
      - id: call-frequency-heatmap
        title: Call Frequency Analysis
        type: table
        columns: [Program Called, Call Count, Called From Paragraphs, Category]
        instruction: |
          **PRIMARY SOURCE: superbol_cfg.calls[]**
          Extract ALL entries from superbol_cfg.calls[] array
          For each unique program name in "to" field, count occurrences

          Steps:
          1. Get all calls from superbol_cfg.calls[]
          2. Group by "to" (program name)
          3. Count how many times each program appears
          4. List "from" paragraphs that call each program
          5. Categorize by frequency

          If superbol_cfg.calls[] is empty: output "No external calls found"
          If superbol_cfg.calls[] has entries: create table with ALL programs

          Categorize by frequency:
          - 🔥 Critical: >5 calls
          - ⚠️ High: 3-5 calls
          - ℹ️ Medium: 1-2 calls

          Sort by call count descending.
        template: |
          | {{program_name}} | {{call_count}} | {{calling_paragraphs}} | {{category_icon}} {{category}} |

      - id: program-call-diagram
        title: Program Call Hierarchy
        type: mermaid
        mermaid_type: graph
        instruction: |
          Create Mermaid diagram showing this program's dependencies.

          **PRIMARY SOURCE: superbol_cfg.calls[]**
          Extract program names from superbol_cfg.calls[] array
          Create diagram with current program calling external programs

          **CRITICAL:** Apply Mermaid sanitization rules:
          - Program names must be sanitized for use as node IDs
          - Use backtick syntax for labels with special characters
          - Replace " with ', / with -, * with -

          Steps:
          1. Current program as central node (styled prominently, sanitized ID)
          2. For EACH entry in superbol_cfg.calls[], create a dashed arrow to "to" program
          3. Add line number labels from "line" field: -.->|"line N"|
          4. Color-code external programs (use classDef external)

          If superbol_cfg.calls[] is empty: output "No external calls to display"
          If superbol_cfg.calls[] has entries: show ALL calls in diagram

          Example:
          ```
          MAINPROG((MAINPROG))
          MAINPROG -.->|"line 33"| LOGGER
          MAINPROG -.->|"line 45"| DBCONNECT
          ```
        template: |
          ```mermaid
          graph LR
            CURRENT{{{{program_name}}}}
            {{called_program_nodes}}
            {{call_relationships_with_frequency}}

            classDef current fill:#f9f,stroke:#333,stroke-width:4px
            classDef critical fill:#f66,stroke:#333,stroke-width:2px
            classDef high fill:#fc9,stroke:#333,stroke-width:2px
            classDef medium fill:#9cf,stroke:#333,stroke-width:1px
            class CURRENT current
            {{frequency_styling}}
          ```

      - id: system-wide-dependencies
        title: System-Wide Program Dependencies
        type: mermaid
        mermaid_type: graph
        instruction: |
          From gnucobol_analysis.program_calls (ALL programs), create a system architecture view.

          **CRITICAL:** Apply Mermaid sanitization rules:
          - All program names must be sanitized for node IDs
          - Subgraph IDs must be valid alphanumeric identifiers (no spaces, special chars)
          - Use backtick syntax for labels with special characters

          Show:
          1. Current program highlighted (sanitized ID)
          2. Programs it calls (1 level deep, sanitized IDs)
          3. Programs those call (2 levels deep if not too complex, sanitized IDs)
          4. Identify architectural layers (valid subgraph IDs)

          This gives context of where this program fits in the system.
        template: |
          ```mermaid
          graph TD
            subgraph "Entry Layer"
              {{entry_programs}}
            end

            subgraph "Business Logic Layer"
              {{business_programs}}
              {{current_program_highlighted}}
            end

            subgraph "Data Access Layer"
              {{data_programs}}
            end

            subgraph "Utility Services"
              {{utility_programs}}
            end

            {{layer_relationships}}
          ```

      - id: call-details-with-context
        title: Detailed Call Analysis
        instruction: |
          **CRITICAL - Document Each External Program:**
          Use superbol_cfg.calls[] as PRIMARY source

          For EACH unique program name in superbol_cfg.calls[] "to" field:
          1. List ALL paragraphs that call it (from "from" field)
          2. List ALL line numbers (from "line" field)
          3. Count total calls to this program
          4. Infer purpose from program name and context

          If superbol_cfg.calls[] is empty: output "No external programs called"
          If superbol_cfg.calls[] has entries: create subsection for EACH unique program

          Optional: From gnucobol_analysis.call_summary.call_counts (if available):
          - Add system-wide usage statistics
          - Show how many other programs call this

          Explain the purpose and integration pattern for each called program.
        repeatable: true
        template: |
          ### {{called_program_name}}

          **This Program's Usage**:
          - Call Count: {{local_call_count}}
          - Called From Paragraphs:
            {{paragraph_and_line_list}}

          **System-Wide Context** (if available):
          - Total Calls Across System: {{system_wide_call_count}}
          - Called By {{programs_calling_count}} different programs
          - Classification: {{program_role}}

          **Purpose & Integration**:
          {{inferred_purpose_and_integration}}

  - id: business-logic
    title: Business Logic Explanation
    instruction: |
      Synthesize all metadata to explain business logic with execution flow.

      CRITICAL: Use superbol_cfg.performs[] AND superbol_cfg.calls[] to create accurate sequence:

      From performs[]:
      - Build paragraph execution order
      - Identify loops (PERFORM UNTIL patterns)
      - Track conditional branching

      From calls[]:
      - Show external program interactions IN SEQUENCE
      - Include line numbers in sequence flow
      - Show bi-directional communication patterns

      Create realistic execution flow showing:
      1. Initialization sequence
      2. Main business logic with branches
      3. Error handling paths
      4. Cleanup sequence
    sections:
      - id: execution-flow-sequence
        title: Execution Flow Sequence
        type: mermaid
        mermaid_type: sequence
        instruction: |
          Create detailed sequence diagram from metadata showing REALISTIC execution flow.

          **CRITICAL - Mermaid Sequence Diagram Sanitization:**
          Participant names in sequence diagrams must be sanitized:
          1. Replace spaces with underscores or remove them
          2. Remove or replace special characters: " ' / \ * -
          3. Use only alphanumeric and underscores
          4. Keep names short (under 20 chars if possible)

          Sanitization Examples for Sequence Diagrams:
          - Original: L"S"/"GENL" → Sanitized: LSGENL
          - Original: INIT-SYSTEM → Sanitized: INITSYSTEM
          - Original: 000026*REMARKS → Sanitized: REMARKS_000026

          Use superbol_cfg to build sequence:
          1. Start with MAIN-PROGRAM or entry paragraph (sanitized name)
          2. Follow performs[] to show internal paragraph calls (sanitized names)
          3. Integrate calls[] to show external program interactions (sanitized names)
          4. Include line numbers as notes
          5. Show loops, conditionals, and error paths

          Example structure with sanitization:
          ```
          User->>MAINPROG: Start
          MAINPROG->>INITSYSTEM: PERFORM (line 21)
          INITSYSTEM->>DBCONNECT: CALL (line 33)
          Note over DBCONNECT: Establishes DB connection
          DBCONNECT-->>INITSYSTEM: Return
          INITSYSTEM->>LOGGER: CALL (line 38)
          LOGGER-->>INITSYSTEM: Return
          loop User Operations
              MAINPROG->>PROCESSSELECTION: PERFORM
              alt Customer Operations
                  PROCESSSELECTION->>CUSTMGMT: CALL (line 71)
              alt Account Operations
                  PROCESSSELECTION->>ACCTOPER: CALL (line 82)
              alt Transactions
                  PROCESSSELECTION->>TRANPROC: CALL (line 96)
              end
          end
          ```

          Be comprehensive but realistic - show actual execution path.
        template: |
          ```mermaid
          sequenceDiagram
            participant User
            participant {{program_name}}
            {{external_program_participants}}

            {{detailed_execution_sequence}}
          ```

      - id: business-operations-catalog
        title: Business Operations Catalog
        instruction: |
          Identify and document distinct business operations by analyzing paragraph patterns.

          Group related paragraphs (e.g., all HANDLE-* paragraphs are operations).

          For each operation:
          - Purpose (what business function)
          - Paragraphs involved (from ctags)
          - Data used (from ctags data items)
          - External programs called (from superbol_cfg.calls)
          - Success/error flows

          This creates a catalog of what this program CAN DO.
        repeatable: true
        template: |
          ### {{operation_name}}

          **Business Purpose**: {{business_purpose}}

          **Implementation**:
          - Primary Paragraph: {{primary_paragraph}} (Line {{line}})
          - Supporting Paragraphs: {{supporting_paragraphs}}

          **Data Requirements**:
          {{required_data_items}}

          **External Dependencies**:
          {{external_programs_called}}

          **Process Flow**:
          {{step_by_step_flow}}

          **Error Handling**:
          {{error_handling_approach}}

  - id: error-handling
    title: Error Handling Strategy
    instruction: |
      Document error handling approach:
      1. Identify error codes (WS-RETURN-CODE, etc.)
      2. Find error handling paragraphs
      3. Document ERRHANDL program calls
      4. Identify validation points
    template: |
      **Error Code Variables**: {{error_variables}}

      **Error Handling Approach**:
      {{error_handling_description}}

      **Validation Points**:
      {{validation_points}}

      **Error Handler Invocations**:
      {{error_handler_calls}}

  - id: technical-details
    title: Technical Details
    instruction: |
      Document technical implementation details for developers.
    sections:
      - id: code-metrics
        title: Code Metrics
        type: table
        columns: [Metric, Value]
        instruction: |
          Calculate from metadata:
          - Total lines (from superbol location ranges)
          - Number of paragraphs (from ctags)
          - Number of data items (from ctags)
          - Number of external calls (from gnucobol)
          - Cyclomatic complexity (estimate from CFG edges)
        template: |
          | {{metric_name}} | {{metric_value}} |

      - id: dependencies-matrix
        title: Dependencies Matrix
        type: table
        columns: [Dependency Type, Name, Count, Lines]
        instruction: |
          List all dependencies:
          - External programs called
          - Data structures used
          - Files accessed (if any)
        template: |
          | {{dependency_type}} | {{dependency_name}} | {{usage_count}} | {{line_numbers}} |

  - id: code-references
    title: Code References
    instruction: |
      Provide easy navigation references to source code locations.
      All line numbers should link back to source file.
    template: |
      ### Quick Reference Links

      {{code_reference_links}}

  - id: inter-file-relationships
    title: Inter-File Relationships
    instruction: |
      Document how this program relates to other programs in the project.
      This section uses PROJECT-LEVEL metadata to show the bigger picture.

      **DATA SOURCES:**
      1. project_call_graph: From superbol/cfg/call_graph.json - shows all CALL relationships across the project
      2. project_relationships: From gnucobol/project-relationships.json - shows program dependencies

      **ANALYSIS GOALS:**
      1. Show which programs CALL this program (callers/dependents)
      2. Show which programs this program CALLS (callees/dependencies)
      3. Identify shared copybooks across programs
      4. Position this program in the overall system architecture
    sections:
      - id: callers-analysis
        title: Programs That Call This Program
        instruction: |
          From project_call_graph (call_graph.json), find ALL entries where "to" matches this program name.

          For each caller:
          - Program name (the file that contains the CALL)
          - Calling paragraph (the "from" field)
          - Line number of the CALL statement

          If no programs call this one, state: "This is a top-level/entry program - no callers found"

          This shows who DEPENDS on this program.
        template: |
          {{#if callers}}
          | Calling Program | Calling Paragraph | Line | Purpose |
          |-----------------|-------------------|------|---------|
          {{caller_table_rows}}
          {{else}}
          **This is a top-level/entry program** - No other programs call this program directly.
          {{/if}}

      - id: callees-analysis
        title: Programs Called By This Program
        instruction: |
          From project_call_graph (call_graph.json), find the entry for this program's file.
          List ALL programs in its calls array.

          For each callee:
          - Program name (the "to" field)
          - Calling paragraph in THIS program (the "from" field)
          - Line number

          This shows what this program DEPENDS on.
        template: |
          {{#if callees}}
          | Called Program | Called From Paragraph | Line | Purpose |
          |----------------|----------------------|------|---------|
          {{callee_table_rows}}
          {{else}}
          **This program makes no external calls** - It is self-contained.
          {{/if}}

      - id: dependency-graph
        title: Program Dependency Graph
        type: mermaid
        mermaid_type: graph
        instruction: |
          Create a Mermaid diagram showing this program's position in the call hierarchy.

          **CRITICAL:** Apply Mermaid sanitization rules:
          - Node IDs: alphanumeric and underscores only
          - Labels: use backtick syntax for special characters

          Show THREE levels:
          1. Programs that call THIS program (upstream/callers) - at top
          2. THIS program (highlighted in center)
          3. Programs that THIS program calls (downstream/callees) - at bottom

          Use different arrow styles:
          - Solid arrows (-->) for direct calls
          - Different colors for different program types

          Example:
          ```
          subgraph Callers
            MAINPROG[MAINPROG]
            BATCHJOB[BATCHJOB]
          end

          MAINPROG --> THISPROG
          BATCHJOB --> THISPROG

          THISPROG{{THIS_PROGRAM}}

          subgraph Dependencies
            LOGGER[LOGGER]
            DBACCESS[DBACCESS]
          end

          THISPROG --> LOGGER
          THISPROG --> DBACCESS
          ```
        template: |
          ```mermaid
          graph TD
            subgraph Callers ["Programs That Call {{program_name}}"]
              {{caller_nodes}}
            end

            {{caller_edges}}

            {{program_name}}_NODE{{"{{program_name}}"}}

            subgraph Dependencies ["Programs Called By {{program_name}}"]
              {{callee_nodes}}
            end

            {{callee_edges}}

            classDef current fill:#f9f,stroke:#333,stroke-width:4px
            classDef caller fill:#bbf,stroke:#333,stroke-width:2px
            classDef callee fill:#bfb,stroke:#333,stroke-width:2px
            class {{program_name}}_NODE current
            {{caller_styling}}
            {{callee_styling}}
          ```

      - id: shared-copybooks
        title: Shared Copybooks Analysis
        instruction: |
          From project_relationships (project-relationships.json), identify copybooks used by this program
          that are also used by other programs.

          For each shared copybook:
          - Copybook name
          - List of programs that use it (including this one)
          - Inferred data sharing purpose

          This shows data structure dependencies across the system.
        template: |
          {{#if shared_copybooks}}
          | Copybook | Used By Programs | Purpose |
          |----------|------------------|---------|
          {{shared_copybook_rows}}
          {{else}}
          No shared copybooks identified in project metadata.
          {{/if}}

      - id: system-position
        title: System Architecture Position
        instruction: |
          Based on the caller/callee analysis, describe this program's role:

          1. **Entry Point**: If no callers exist, this is likely a main/entry program
          2. **Utility/Service**: If many callers but few callees, this is a shared service
          3. **Business Logic**: If balanced callers/callees, this is core business logic
          4. **Data Access**: If it primarily calls DB programs, this is a data access layer

          Provide a 2-3 sentence summary of where this program fits architecturally.
        template: |
          **Architectural Role**: {{architectural_role}}

          **Position Summary**:
          {{position_summary}}

          **Integration Pattern**:
          - Upstream Dependencies: {{caller_count}} programs depend on this
          - Downstream Dependencies: {{callee_count}} programs are called by this
          - Coupling Level: {{coupling_assessment}}

  - id: metadata-appendix
    title: Appendix - Metadata Summary
    instruction: |
      Include summary of metadata used for documentation generation.
      This provides transparency and debugging capability.
    sections:
      - id: superbol-summary
        title: Control Flow Analysis Metadata
        template: |
          **Symbols Found**: {{symbol_count}}
          **CFG Nodes**: {{cfg_node_count}}
          **CFG Edges**: {{cfg_edge_count}}
          **External Calls**: {{external_call_count}}

      - id: gnucobol-summary
        title: Semantic Analysis Metadata
        template: |
          **Program ID**: {{gnucobol_program_id}}
          **Total Calls**: {{gnucobol_call_count}}
          **Unique Programs Called**: {{gnucobol_unique_programs}}
          **Analysis Success**: {{gnucobol_success}}

      - id: ctags-summary
        title: Symbol Parser Metadata
        template: |
          **Total Symbols**: {{ctags_symbol_count}}
          **Divisions**: {{ctags_division_count}}
          **Paragraphs**: {{ctags_paragraph_count}}
          **Data Items**: {{ctags_data_count}}
