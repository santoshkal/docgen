# COBOL Documentation Agent - Configuration File
# ==============================================
# This file contains all configuration options for the COBOL Documentation Agent

# ============================================================================
# SOURCE FILES CONFIGURATION
# ============================================================================
source:
  # Mode: 'single' or 'batch'
  # - single: Process one program specified by program_name
  # - batch: Process all COBOL files in source_files path
  mode: batch

  # Path to COBOL source file(s)
  # Can be:
  #   - A directory containing *.COB files (for batch mode)
  #   - A single .COB file path (for single file processing)
  source_files: ../cobol-source

  # Program name (required for single mode, ignored in batch mode)
  program_name: MAINPROG

  # Workspace directory containing COBOL source files
  # Used when source_files is not specified or for additional context
  workspace: ../cobol-source


# ============================================================================
# OUTPUT PATHS CONFIGURATION
# ============================================================================
output:
  # Directory for storing extracted metadata (ctags, gnucobol, superbol)
  metadata_dir: ../output

  # Directory for storing generated documentation markdown files
  docs_path: ../docs

  # Create output directories if they don't exist
  create_dirs: true


# ============================================================================
# METADATA GENERATION (MCP) CONFIGURATION
# ============================================================================
metadata:
  # Whether to generate metadata via MCP servers. TODO: Requried?
  generate: true

  # Skip metadata generation if files already exist TODO: Required?
  skip_existing: true

  # Force regenerate all metadata even if it exists TODO: REquired?
  force_regenerate: false

  # MCP Servers Configuration (optional - uses defaults if not specified)
  servers:
    ctags:
      enabled: true
      docker_image: ctags-mcp-server:latest
      # Custom docker args (optional)
      # docker_args: []

    gnucobol:
      enabled: true
      docker_image: gnucobol-mcp-server:latest

    superbol:
      enabled: true
      docker_image: superbol-mcp-server:latest


# ============================================================================
# TEMPLATE CONFIGURATION
# ============================================================================
template:
  # Path to documentation template YAML file
  path: ./cobol-doc-template.yaml

  # Custom template variables (optional)
  # These will be available in the template as {{custom.variable_name}}
  custom_vars:
    company_name: "Your Company Name"
    project_name: "COBOL Modernization Project"
    author: "Documentation Team"


# ============================================================================
# PROGRAM MAP CONFIGURATION
# ============================================================================
# Program map provides a lightweight hierarchical summary of COBOL programs
# for efficient LLM context. Configure limits to balance detail vs token usage.
program_map:
  # Number of top paragraphs to include in program map
  # Set to -1 to include all paragraphs (useful for large context windows)
  # Default: 30
  top_n_paragraphs: 30

  # Number of top data items to include in program map
  # Set to -1 to include all data items (useful for large context windows)
  # Default: 20
  top_n_data_items: 20

  # Show all elements regardless of limits (overrides top_n settings)
  # Default: false
  show_all: false

  # Dynamic limits based on program size
  # When enabled, limits automatically adjust based on paragraph count:
  # - SMALL (< 100 paragraphs): Show all elements
  # - MEDIUM (100-499 paragraphs): Top 200 paragraphs, top 100 data items
  # - LARGE (500+ paragraphs): Top 300 paragraphs, top 150 data items
  dynamic_limits:
    # Enable automatic size-based limit adjustment
    # Default: false
    enabled: false

    # Threshold for small programs (below this = SMALL)
    # Default: 100
    small_threshold: 100

    # Threshold for large programs (at or above this = LARGE)
    # Default: 500
    large_threshold: 500

    # Limits for small programs (show all by default)
    small:
      paragraphs: -1
      data_items: -1

    # Limits for medium programs
    medium:
      paragraphs: 200
      data_items: 100

    # Limits for large programs
    large:
      paragraphs: 300
      data_items: 150

  # Tiered detail levels for program map
  # Shows different levels of detail based on element importance rank:
  # - Tier 1: Full details (line numbers, scores, relationships)
  # - Tier 2: Names and scores only
  # - Tier 3: Summary count ("...and N more paragraphs")
  tiered_details:
    # Enable tiered detail levels
    # Default: false
    enabled: false

    # Number of elements to show with full details (Tier 1)
    # Default: 50
    tier1_limit: 50

    # Number of elements to show with names/scores (Tier 1 + Tier 2)
    # Elements beyond this show as summary count
    # Default: 200
    tier2_limit: 200

  # Mandatory elements configuration
  # Ensures critical elements are always included regardless of importance rank:
  # - Entry points: MAIN, START, INIT patterns
  # - Call sites: Paragraphs that make external CALL statements
  # - Error handlers: ERROR, ERR, EXCEPTION, ABEND patterns
  mandatory_elements:
    # Enable mandatory element inclusion
    # Default: true
    enabled: true

    # Patterns to identify entry points (case-insensitive substring match)
    # Elements matching any pattern will be included in Critical Elements section
    entry_point_patterns:
      - MAIN
      - START
      - INIT
      - BEGIN
      - ENTRY
      - "0000-"

    # Patterns to identify error handlers (case-insensitive substring match)
    error_handler_patterns:
      - ERROR
      - ERR
      - EXCEPTION
      - ABEND
      - FAIL


# ============================================================================
# FULL CONTEXT MODE CONFIGURATION
# ============================================================================
# Full context mode sends complete source code + metadata + program map
# to the LLM for each section, enabling more comprehensive documentation.
# This is more expensive (more tokens) but produces higher quality output.
full_context:
  # Enable full context mode (default: false for backward compatibility)
  # When disabled, uses filtered/chunked context (original behavior)
  enabled: false

  # Sections that should use full context when enabled
  # These sections benefit most from having access to complete source code
  # and metadata for generating comprehensive documentation.
  # If not specified when enabled=true, defaults to these sections:
  sections:
    - executive-summary      # High-level program summary
    - key-responsibilities   # Main functions/responsibilities
    - business-logic         # Business rules and logic explanation
    - overview               # Program structure overview
    - data-flow-analysis     # Data transformation tracking

  # Program map configuration for full context mode
  # These override the program_map settings above when full context is active
  program_map_overrides:
    # Show more elements when using full context (larger context window)
    top_n_paragraphs: 100
    top_n_data_items: 50

  # Context chaining configuration
  # When enabled, previous section outputs are included in subsequent section prompts
  # This enables cross-section consistency (e.g., key responsibilities referencing
  # the executive summary terminology)
  context_chaining:
    # Enable context chaining (default: false)
    # Requires full_context.enabled: true to take effect
    enabled: false

    # Maximum tokens for chained context (optional)
    # Limits the size of previous section outputs included in prompts
    # Set to null for no limit (include all previous outputs)
    # Default: null (no limit)
    max_tokens: null


# ============================================================================
# LLM CONFIGURATION
# ============================================================================
llm:
  # LLM Provider TODO: Review
  #
  # Supported: openai, anthropic, azure_openai, google, ollama, bedrock
  provider: openai

  # Model name (provider-specific)
  # OpenAI: gpt-4o, gpt-4-turbo, gpt-3.5-turbo
  # Anthropic: claude-3-5-sonnet-20241022, claude-3-opus-20240229
  # Azure: Your deployment name
  # Google: gemini-pro, gemini-1.5-pro
  # Ollama: llama2, mistral, codellama
  model: gpt-4o

  # API Key (or set via environment variable)
  # TODO: Should read ENVs
  # 
  # Leave empty to use environment variables:
  #   - OpenAI: OPENAI_API_KEY
  #   - Anthropic: ANTHROPIC_API_KEY
  #   - Azure: AZURE_OPENAI_API_KEY
  #   - Google: GOOGLE_API_KEY
  api_key: ${OPENAI_API_KEY}

  # Temperature (0.0 - 1.0)
  # Lower = more focused/deterministic, Higher = more creative
  temperature: 0.2

  # Max tokens for response
  max_tokens: 4096

  # System prompt override (optional)
  # If not specified, uses default prompts from the agent
  # system_prompt: "You are an expert COBOL documentation writer..."

  # Provider-specific configurations
  openai:
    # API base URL (optional, for custom endpoints)
    # api_base: https://api.openai.com/v1

    # Organization ID (optional)
    # organization: org-xxxxx

  anthropic:
    # API base URL (optional)
    # api_base: https://api.anthropic.com

    # Max tokens to sample
    max_tokens_to_sample: 4096

  azure_openai:
    # Required for Azure
    api_base: https://your-resource.openai.azure.com
    api_version: "2024-02-15-preview"
    deployment_name: your-gpt4-deployment

  google:
    # Project ID for Google Cloud
    # project_id: your-project-id

    # Location
    # location: us-central1

  ollama:
    # Ollama base URL
    base_url: http://localhost:11434

    # Additional parameters
    # num_ctx: 4096
    # num_predict: 2048

  bedrock:
    # AWS Region
    region_name: us-east-1

    # Model ID
    # model_id: anthropic.claude-3-sonnet-20240229-v1:0


# ============================================================================
# BATCH PROCESSING CONFIGURATION
# ============================================================================
batch:
  # Enable parallel processing of multiple files
  parallel: false

  # Number of files to process concurrently (if parallel=true)
  max_workers: 4

  # Continue processing even if some files fail
  continue_on_error: true

  # Generate summary report after batch processing
  generate_report: true


# ============================================================================
# LOGGING AND OUTPUT CONFIGURATION
# ============================================================================
logging:
  # Log level: debug, info, warning, error
  level: info

  # Enable verbose output
  verbose: true

  # Log file path (optional, logs to stdout if not specified)
  # log_file: ./cobol_doc_agent.log

  # Show progress bars
  show_progress: true


# ============================================================================
# ADVANCED CONFIGURATION
# ============================================================================
advanced:
  # Retry configuration for LLM calls
  llm_retry:
    max_retries: 3
    retry_delay: 2  # seconds

  # Timeout for external operations (seconds)
  timeouts:
    mcp_generation: 600  # 10 minutes for metadata generation
    llm_call: 120        # 2 minutes per LLM call
    docker_pull: 300     # 5 minutes for Docker image pull

  # Cache configuration
  cache:
    # Enable caching of LLM responses
    enable_llm_cache: false

    # Cache directory
    # cache_dir: ./.cache

  # Section processing
  sections:
    # Skip certain sections (list of section IDs from template)
    skip: []

    # Process only specific sections
    # only: ["executive-summary", "program-structure"]


# ============================================================================
# VALIDATION AND SAFETY
# ============================================================================
validation:
  # Validate COBOL source files before processing
  validate_cobol_syntax: false

  # Check for required metadata files before doc generation
  check_metadata: true

  # Maximum file size to process (MB)
  max_file_size: 10


# ============================================================================
# EXPERIMENTAL FEATURES (Use with caution)
# ============================================================================
experimental:
  # Use streaming for LLM responses
  use_streaming: false

  # Enable multi-agent collaboration (if supported)
  multi_agent: false

  # Custom post-processing scripts
  # post_process_script: ./custom_postprocess.py
