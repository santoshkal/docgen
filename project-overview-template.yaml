# Project Overview Documentation Template
# This template generates a project-level summary document that provides
# a high-level view of the entire COBOL project and its architecture.
#
# This document is generated AFTER all individual program documents are complete.

template:
  id: project-overview-template-v1
  name: Project Overview Documentation
  version: 1.0
  output:
    format: markdown
    filename: "docs/PROJECT-OVERVIEW.md"
    title: "{{project_name}} - Project Overview"

workflow:
  mode: automated
  metadata_sources:
    - file_list           # From tree MCP - all files in project
    - project_call_graph  # From superbol/cfg/call_graph.json
    - project_relationships  # From gnucobol/project-relationships.json
    - project_cfg         # From superbol/project-cfg.json

sections:
  - id: project-header
    title: "Project Header"
    instruction: |
      Create the document header with project information.
      Include generation timestamp, total file count, and metadata summary.
    template: |
      # {{project_name}} - Project Overview

      *Generated: {{generation_timestamp}}*

      ---

      **Project Statistics:**
      - Total COBOL Programs: {{total_programs}}
      - Total Copybooks: {{total_copybooks}}
      - Total Lines of Code: {{total_loc}}
      - Documentation Generated: {{doc_count}} files

      ---

  - id: executive-summary
    title: Executive Summary
    instruction: |
      Provide a high-level summary of the entire project:

      1. **Project Purpose**: Infer from program names and relationships what this system does
      2. **Core Components**: Identify the main/entry programs
      3. **Architecture Style**: Batch processing, online/interactive, mixed
      4. **Key Business Functions**: What operations does this system support

      Analyze the project_call_graph to identify:
      - Entry points (programs with no callers)
      - Core services (programs called by many others)
      - Utility programs (helper/shared functions)

      Keep this to 3-5 paragraphs maximum.
    template: |
      ## Executive Summary

      {{project_summary}}

      ### Key Business Capabilities
      {{business_capabilities_list}}

      ### System Characteristics
      - **Architecture Type**: {{architecture_type}}
      - **Processing Mode**: {{processing_mode}}
      - **Integration Complexity**: {{integration_complexity}}

  - id: program-inventory
    title: Program Inventory
    instruction: |
      Create a comprehensive inventory of all programs in the project.

      From file_list, categorize programs by:
      1. Directory location (batch, online, utilities, etc.)
      2. Program type (inferred from name patterns)
      3. Complexity (based on call count)

      Sort by importance (entry points first, then by call frequency).
    sections:
      - id: program-catalog
        title: Program Catalog
        type: table
        columns: [Program, Location, Type, Calls Made, Called By, Description]
        instruction: |
          For EACH program in the project:
          - Program name (from file_list)
          - Location (directory path)
          - Type (Entry/Service/Utility/Data Access)
          - Number of external calls it makes
          - Number of programs that call it
          - Brief description (inferred from name and relationships)

          Sort by: Entry points first, then by "Called By" count descending.
        template: |
          | {{program_name}} | {{location}} | {{program_type}} | {{calls_made}} | {{called_by_count}} | {{description}} |

      - id: program-by-layer
        title: Programs by Architectural Layer
        instruction: |
          Group programs into architectural layers:

          **Entry Layer** (no callers):
          - Main programs, batch jobs, online entry points

          **Business Logic Layer** (balanced callers/callees):
          - Core business processing programs

          **Service Layer** (many callers, few callees):
          - Shared services, validation, formatting

          **Data Access Layer** (called by business, calls DB):
          - Database access, file I/O programs

          **Utility Layer** (called by many, no dependencies):
          - Logging, date handling, error handling
        template: |
          ### Entry Layer
          {{entry_layer_programs}}

          ### Business Logic Layer
          {{business_layer_programs}}

          ### Service Layer
          {{service_layer_programs}}

          ### Data Access Layer
          {{data_access_programs}}

          ### Utility Layer
          {{utility_programs}}

  - id: system-architecture
    title: System Architecture
    instruction: |
      Create visual representations of the system architecture.
      Use project_call_graph to build comprehensive diagrams.
    sections:
      - id: full-call-graph
        title: Complete System Call Graph
        type: mermaid
        mermaid_type: graph
        instruction: |
          Create a Mermaid diagram showing ALL program relationships.

          **CRITICAL:** Apply Mermaid sanitization rules:
          - Node IDs: alphanumeric and underscores only
          - Use subgraphs to group by layer/directory

          From project_call_graph (call_graph.json):
          1. Create a node for each program
          2. Draw edges for each call relationship
          3. Color-code by layer (entry=pink, business=blue, service=green, utility=yellow)
          4. Group into subgraphs by directory

          Keep diagram readable - if too many nodes, create simplified version.
        template: |
          ```mermaid
          graph TD
            subgraph Entry ["Entry Points"]
              {{entry_nodes}}
            end

            subgraph Business ["Business Logic"]
              {{business_nodes}}
            end

            subgraph Services ["Shared Services"]
              {{service_nodes}}
            end

            subgraph Utilities ["Utilities"]
              {{utility_nodes}}
            end

            {{all_call_edges}}

            classDef entry fill:#fdd,stroke:#c00,stroke-width:2px
            classDef business fill:#ddf,stroke:#00c,stroke-width:2px
            classDef service fill:#dfd,stroke:#0c0,stroke-width:2px
            classDef utility fill:#ffd,stroke:#cc0,stroke-width:2px
            {{node_styling}}
          ```

      - id: simplified-architecture
        title: Simplified Architecture View
        type: mermaid
        mermaid_type: graph
        instruction: |
          Create a simplified view showing only the major program groups and their relationships.

          Aggregate programs into logical groups:
          - Account Management
          - Customer Management
          - Transaction Processing
          - Reporting
          - Utilities

          Show inter-group dependencies at a high level.
        template: |
          ```mermaid
          graph LR
            {{simplified_architecture_diagram}}
          ```

  - id: data-flow-overview
    title: Data Flow Overview
    instruction: |
      Document how data flows through the system at a project level.
    sections:
      - id: copybook-usage
        title: Shared Data Structures (Copybooks)
        instruction: |
          From project_relationships, identify all copybooks and which programs use them.

          For each copybook:
          - Name
          - Purpose (inferred from name)
          - Programs that include it
          - Data sharing implications

          This shows how data is shared across the system.
        template: |
          ### Copybook Usage Matrix

          | Copybook | Purpose | Used By Programs |
          |----------|---------|------------------|
          {{copybook_usage_rows}}

      - id: data-flow-diagram
        title: System Data Flow
        type: mermaid
        mermaid_type: graph
        instruction: |
          Create a data flow diagram showing:
          1. External inputs (files, user input, other systems)
          2. Major data transformations
          3. External outputs (reports, files, other systems)
          4. Key copybooks as data stores

          Focus on the big picture, not individual programs.
        template: |
          ```mermaid
          graph LR
            {{data_flow_diagram}}
          ```

  - id: inter-program-relationships
    title: Inter-Program Relationships
    instruction: |
      Detailed analysis of how programs interact.
    sections:
      - id: call-frequency-analysis
        title: Call Frequency Analysis
        type: table
        columns: [Called Program, Total Calls, Unique Callers, Category]
        instruction: |
          From project_call_graph, count how often each program is called.

          Sort by total call count descending.

          Categorize:
          - Critical (>10 callers): Core system component
          - High (5-10 callers): Important shared service
          - Medium (2-4 callers): Specialized function
          - Low (1 caller): Tightly coupled or specialized
        template: |
          | {{program_name}} | {{total_calls}} | {{unique_callers}} | {{category}} |

      - id: dependency-matrix
        title: Program Dependency Matrix
        instruction: |
          Create a matrix showing which programs depend on which.

          Rows: Calling programs
          Columns: Called programs
          Cells: Number of call sites

          This reveals coupling patterns and potential refactoring opportunities.
        template: |
          {{dependency_matrix}}

      - id: circular-dependencies
        title: Circular Dependency Analysis
        instruction: |
          Analyze the call graph for circular dependencies (A calls B, B calls A).

          Circular dependencies can indicate:
          - Tight coupling that may need refactoring
          - Legitimate bidirectional communication
          - Potential issues for testing/maintenance

          List any circular dependencies found with explanation.
        template: |
          {{circular_dependency_analysis}}

  - id: business-logic-summary
    title: Business Logic Summary
    instruction: |
      Summarize the business functions implemented by this system.
    sections:
      - id: business-operations
        title: Business Operations Catalog
        instruction: |
          From program names and relationships, identify distinct business operations:

          For each operation:
          - Operation name (inferred)
          - Primary program(s) implementing it
          - Supporting programs
          - Data structures used (copybooks)

          Examples: Account Creation, Transaction Processing, Report Generation, etc.
        template: |
          ### {{operation_name}}

          **Primary Programs**: {{primary_programs}}
          **Supporting Programs**: {{supporting_programs}}
          **Data Structures**: {{data_structures}}
          **Business Purpose**: {{business_purpose}}

      - id: batch-vs-online
        title: Batch vs Online Processing
        instruction: |
          Identify and separate batch processing from online/interactive processing:

          **Batch Programs** (typically in /batch directory or named *BATCH*, *EOD*, *REPORT*):
          - List programs
          - Typical execution schedule (inferred)
          - Dependencies

          **Online Programs** (typically in /online directory or interactive):
          - List programs
          - User interactions
          - Real-time processing
        template: |
          ### Batch Processing Programs
          {{batch_programs_list}}

          ### Online/Interactive Programs
          {{online_programs_list}}

  - id: technical-summary
    title: Technical Summary
    instruction: |
      Provide technical metrics and characteristics of the codebase.
    sections:
      - id: code-metrics
        title: Project Code Metrics
        type: table
        columns: [Metric, Value]
        instruction: |
          Calculate project-wide metrics:
          - Total programs
          - Total copybooks
          - Total lines of code (sum from all files)
          - Average program size
          - Largest/smallest programs
          - Total external call sites
          - Most called program
          - Most calling program
        template: |
          | {{metric_name}} | {{metric_value}} |

      - id: complexity-distribution
        title: Complexity Distribution
        instruction: |
          Analyze complexity distribution across programs:
          - Simple (1-3 external calls): X programs
          - Medium (4-7 external calls): Y programs
          - Complex (8+ external calls): Z programs

          Identify the most complex programs that may need extra attention.
        template: |
          ### Complexity by External Call Count

          {{complexity_distribution_chart}}

          ### High Complexity Programs (8+ calls)
          {{high_complexity_programs}}

  - id: documentation-index
    title: Documentation Index
    instruction: |
      Provide an index/table of contents for all generated documentation files.
    template: |
      ## Documentation Index

      The following individual program documentation files have been generated:

      | Program | Documentation File | Lines | Complexity |
      |---------|-------------------|-------|------------|
      {{documentation_file_index}}

      ### How to Navigate

      1. **Start here** for project overview and architecture
      2. **Entry point programs** for understanding main flows
      3. **Individual program docs** for detailed implementation

  - id: appendix
    title: Appendix
    instruction: |
      Include reference information and metadata summary.
    sections:
      - id: file-listing
        title: Complete File Listing
        instruction: |
          List all files in the project with their locations.
        template: |
          ### COBOL Programs
          {{program_file_listing}}

          ### Copybooks
          {{copybook_file_listing}}

      - id: generation-metadata
        title: Generation Metadata
        template: |
          **Generated**: {{generation_timestamp}}
          **Generator Version**: {{generator_version}}
          **Metadata Sources**:
          - Tree MCP: {{tree_mcp_file_count}} files scanned
          - SuperBOL CFG: {{superbol_cfg_count}} programs analyzed
          - GnuCOBOL: {{gnucobol_analysis_count}} programs analyzed
          - CTags: {{ctags_symbol_count}} symbols extracted

          **Processing Time**: {{total_processing_time}}
          **Total LLM Calls**: {{total_llm_calls}}
          **Total Tokens Used**: {{total_tokens}}
