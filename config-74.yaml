# Test Configuration for COBOL Documentation Agent
# Using test COBOL files from ~/test-cobol

# Source files
source:
  mode: single
  source_files: /home/santosh/cobol-work/TDAS-MINDISTCALC.c74
  program_name: TDAS-MINDISTCALC

# Validate checksums for source files (required), and metadata files, if present.
validate_checksums:
  source_checksum_file_path: /home/santosh/cobol-work/source-checksum.yaml
  metadata_checksum_file_path: /home/santosh/cobol-work/metadata-checksum.yaml

# Output paths
output:
  create_dirs: true
  metadata_dir: /home/santosh/cobol-work/metadata
  docs_path: /home/santosh/cobol-work/docs

# Metadata generation (enabled with checksum-based intelligence)
metadata:
  generate: true
  skip_existing: true

# Source Code Extraction (Phases 1-3)
source_extraction:
  # Phase 1: Basic extraction
  enabled: true  # Enable source code extraction for documentation sections
  compress: true  # Remove comments and blank lines to reduce token usage

  # Phase 2: RipGrep search (pattern-based extraction)
  use_ripgrep: true  # Use ripgrep for pattern-based extraction
  ripgrep_patterns:
    sql: true  # Extract SQL statements
    comments: true  # Extract significant comments
    error_handling: true  # Extract error handling blocks
    calls: true  # Extract CALL statements

  # Phase 3: Multi-file support
  resolve_copybooks: true  # Follow COPY statements to resolve copybooks
  resolve_called_programs: true  # Identify and document called programs
  copybook_search_paths:
    - ./copybooks
    - ./COPY
    - ../copybooks
  program_search_paths:
    - ./programs
    - ./src
    - .
  max_copybook_depth: 3  # Maximum depth for nested copybooks
  max_call_depth: 2  # Maximum depth for call hierarchy

# MCP Config
servers:
  ctags:
    enabled: true
    docker_image: ctags-mcp:test
  gnuCobol:
    enabled: true
    docker_image: gnucobol-mcp:test
  superbol-lsp:
    enabled: true
    docker_image: multilspy-mcp-test:latest

# Documentation template
template:
  path: ./cobol-doc-template.yaml

# LLM configuration
llm:
  provider: openai
  # model: gpt-5
  model: gpt-4.1
  api_key: ${OPENAI_API_KEY}
  temperature: 0.2

# Logging
logging:
  level: info
  format: detailed
